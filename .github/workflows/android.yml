name: Build Proview Label APK
on:
  push: { branches: [main], paths: ["android-app/**", "web/src/**", ".github/workflows/android.yml"] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      # the GitHub runner image already includes the Android SDK (ANDROID_HOME)
      - name: Build web app
        working-directory: web
        run: npm install && npm run build
      - name: Signing key
        env: { KS: "${{ secrets.LABEL_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS" ]; then printf '%s' "$KS" | tr -d ' \r\n\t"' | base64 -d > "$RUNNER_TEMP/proview-label.jks" || { echo "::error::LABEL_KEYSTORE_B64 is not valid - paste the whole of LABEL_KEYSTORE_B64.txt again"; exit 1; }; echo "key file $(wc -c < "$RUNNER_TEMP/proview-label.jks") bytes"; echo "LABEL_KEYSTORE=$RUNNER_TEMP/proview-label.jks" >> "$GITHUB_ENV"; echo "signing with the Proview Label key";
          else echo "::warning::LABEL_KEYSTORE_B64 secret not set - this APK is signed with a temporary key and will not install over other builds"; fi
      - name: Build APK
        working-directory: android-app
        env:
          LABEL_KEYSTORE_PASSWORD: ${{ secrets.LABEL_KEYSTORE_PASSWORD }}
          LABEL_KEY_ALIAS: ${{ secrets.LABEL_KEY_ALIAS }}
        run: |
          npm install
          node prepare-web.js
          npx cap sync android
          cd android && echo "sdk.dir=$ANDROID_HOME" > local.properties && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: proview-label-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
