name: Build Proview Label APK
on:
  push: { branches: [main], paths: ["android-app/**", "web/src/**", ".github/workflows/android.yml"] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      # the GitHub runner image already includes the Android SDK (ANDROID_HOME)
      - name: Build web app
        working-directory: web
        run: npm install && npm run build
      - name: Build APK
        working-directory: android-app
        run: |
          npm install
          node prepare-web.js
          npx cap sync android
          cd android && echo "sdk.dir=$ANDROID_HOME" > local.properties && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: proview-label-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
