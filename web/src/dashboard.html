<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proview Label</title>
<link rel="icon" type="image/png" href="icon-32.png?v=2">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<meta name="theme-color" content="#171c29">
<!-- Proview "Navy" theme: dark by default, Light mode and Menu at bottom switches (shared keys pv.theme / pv.menu).
     Runs before first paint so there is no flash. -->
<script>(function(){var d=document.documentElement,t='dark',m='side';try{t=localStorage.getItem('pv.theme')==='light'?'light':'dark';m=localStorage.getItem('pv.menu')==='bottom'?'bottom':'side';}catch(e){}
d.setAttribute('data-theme',t);if(m==='bottom')d.classList.add('menu-bottom');var c=document.querySelector('meta[name="theme-color"]');if(c)c.setAttribute('content',t==='light'?'#f2f4f9':'#171c29');})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Proview CRM family theme (same tokens as Proview Bookings / Employee / Signage) */
:root{--pri:#4a6cd0;--pri-d:#3a59b8;--pri-l:#edf2fd;--grad:linear-gradient(135deg,#2f84d4 0%,#5a5fbb 100%);--grad-light:linear-gradient(90deg,#62b0ec 0%,#8b88dc 100%);
  --navy:#141418;--navy2:#26262e;--bg:#f4f3ef;--card:#fff;--ink:#17171c;--mut:#55555f;--line:#e4e2dc;
  --ok:#12a150;--okl:#e7f6ed;--warn:#d48a00;--warnl:#fdf3de;--bad:#d92d20;--badl:#fdf0ef;--pur:#6d5fc4;--purl:#efedfb;--grey:#8b8b95;--greyl:#efeee9;
  --font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;--r:12px;--sh:0 1px 2px rgba(20,20,30,.06),0 4px 16px rgba(20,20,30,.05)}
*{box-sizing:border-box}
html,body{height:100%}
/* loading splash: only the app icon, centred on the page background, until the sign-in state is known
   (same as the other Proview apps: 72px icon, page background, 1.2s pulse as Proview Bookings) */
.pv-splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:300}
.pv-splash .logo{width:72px;height:72px;opacity:.9;animation:pvsplash 1.2s ease-in-out infinite}
@keyframes pvsplash{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pv-splash .logo{animation:none}}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--pri)}
/* ===== Proview app shell: the same menu, header tray and breakpoints as Proview Signage and Bookings =====
   desktop: 236px menu (COLLAPSE to a 72px icon rail) · 701-900px: 72px labelled rail · phones: 60px labelled rail
   the site drop-down is always in the header, straight after the page title (as in Proview WiFi); phones: own second header row */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100vh;height:100dvh}
.side{background:#141418;color:#c9c9d1;display:flex;flex-direction:column;overflow:hidden;min-height:0;font-size:15px}
.side .brand{display:flex;align-items:center;gap:10px;padding:18px 10px 14px 14px;color:#fff;text-decoration:none;flex:none}
.brand-mark{width:36px;height:26px;flex:none;background:url(%%MARK_SM%%) center/contain no-repeat}
.logo{width:36px;height:26px;flex:none;background:url(%%MARK_SM%%) center/contain no-repeat}
.wordmark{letter-spacing:.04em;font-size:15px;line-height:20px;white-space:nowrap;font-weight:500;color:#fff}
.wordmark span{background:var(--grad-light);-webkit-background-clip:text;background-clip:text;color:transparent}
.side .nav{flex:1;min-height:0;overflow:auto;padding:6px 10px;display:flex;flex-direction:column}
.side .nav-sep{font-size:11px;line-height:13px;letter-spacing:.08em;text-transform:uppercase;color:#6e6e78;padding:10px 10px 3px;flex:none}
.side .nav a{display:flex;align-items:center;gap:10px;height:30px;flex:none;box-sizing:border-box;padding:0 12px;border-radius:9px;color:#c9c9d1;text-decoration:none;font-size:14px;font-weight:550;line-height:22px;position:relative}
.side .nav a svg{width:16px;height:16px;flex:none}
.side .nav a:hover{background:#1f1f25;color:#fff}
.side .nav a.active{background:#26262e;color:#fff}
.side .nav a.active svg{color:var(--pri)}
.side .nav a.off{opacity:.45;cursor:not-allowed}
.side .nav a.off:hover{background:none;color:#c9c9d1}
.top .hdr-pick.pulse select{animation:hdr-pick-pulse 1s ease-out}
@keyframes hdr-pick-pulse{0%,60%{box-shadow:0 0 0 3px rgba(90,141,238,.55);border-color:#5a8dee}100%{box-shadow:0 0 0 0 rgba(90,141,238,0)}}
.side .nav .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .nav .slbl{display:none}
.side .nav .cnt{margin-left:auto;font-size:11px;line-height:16px;font-weight:600;background:rgba(255,255,255,.12);padding:0 7px;border-radius:10px}
.side .nav .cnt.red{background:var(--bad);color:#fff}
.side-foot{display:flex;align-items:center;padding:0 10px 14px;flex:none}
.sf-link{display:flex;align-items:center;gap:6px;background:none;border:0;color:#8b8b95;letter-spacing:.06em;font-size:12px;font-weight:600;line-height:17px;padding:6px 8px;border-radius:9px;cursor:pointer;font-family:inherit}
.sf-link:hover{color:#fff}.sf-link svg{width:14px;height:14px;flex:none}
.app.collapsed{grid-template-columns:72px minmax(0,1fr)}
@media (min-width:901px){
 .app.collapsed .side{padding:18px 10px}
 .app.collapsed .wordmark,.app.collapsed .nav-sep,.app.collapsed .nav .lbl,.app.collapsed .nav .cnt,.app.collapsed .sf-link .lbl{display:none}
 .app.collapsed .side .brand{justify-content:center;padding:4px 0 18px}
 .app.collapsed .side .nav a{justify-content:center;padding:0}
 .app.collapsed .side-foot{flex-direction:column;gap:4px;padding:0 0 14px}
 .app.collapsed .sf-link{width:30px;height:26px;padding:0;justify-content:center}
 .app.collapsed .sf-link svg{transform:rotate(180deg)}
}
/* main column and header */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line);min-height:62px;box-sizing:border-box;flex:none;font-size:15px;position:relative;z-index:20}
.top h2{font-size:18px;font-weight:700;letter-spacing:-.015em;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .sp{flex:1}
.top h2{flex:none;max-width:40%}
/* site picker: in the top header right after the page title, on every screen size (same as Proview WiFi;
   Bookings and Label use the same .hdr-pick markup and rules) */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.top .hdr-pick { margin: 0 0 0 6px; flex: 0 1 auto; min-width: 0; }
.top .hdr-pick select { display: block; width: auto; height: 38px; max-width: 320px; min-width: 170px; border-radius: 10px; border: 1px solid var(--line); background-color: #fff; color: var(--ink); font: 600 14px var(--font); padding: 0 30px 0 12px; cursor: pointer; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
.top .hdr-pick select:focus { outline: none; border-color: var(--line); }
.top .hdr-pick select:focus-visible { outline: 2px solid #5a8dee; outline-offset: 2px; }
.top .hdr-pick select:disabled { opacity: 1; cursor: default; color: var(--ink); appearance: none; -webkit-appearance: none; padding-right: 12px; }
/* iPad / narrow desktop: the title keeps its width and the picker shrinks (to its 170px minimum) to fit (as Signage) */
@media (min-width: 701px) { .top h2 { flex-shrink: 0; } .top .hdr-pick select { max-width: min(320px, 100%); } }
/* phones: the tray leaves no room on the title row, so the picker gets the header's second row, full width */
@media (max-width: 700px) {
  .top { flex-wrap: wrap; row-gap: 6px; }
  .top .hdr-pick { order: 1; flex: 1 0 100%; margin: 0; }
  .top .hdr-pick select { width: 100%; min-width: 0; max-width: none; height: 36px; font-size: 13px; }
}
/* Label only: the box can shrink (not below 170px) so it never runs under the tray on iPad */
.top .hdr-pick{display:flex}
.hdr-pick+.tag{flex:none}
.hdr-dot[role=button]{cursor:pointer}
/* bell count: the same blue badge as Proview Signage (.bell-dot) */
.top .bell{color:var(--ink);margin-left:0}
.bell .bell-dot{position:absolute;top:1px;right:-2px}
.bell-dot{min-width:18px;height:18px;border-radius:9px;background:var(--grad);color:#fff;font:700 11px/18px var(--font);padding:0 5px;text-align:center}
.bell-dot.hidden{display:none}
.icon-btn{position:relative;background:none;border:1px solid transparent;border-radius:10px;width:38px;height:38px;padding:0;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--bg);border-color:var(--line)}
.top .top-me{display:flex;align-items:center;gap:4px;margin-left:8px;flex:none}
.top-av{width:34px;height:34px;border-radius:50%;border:0;padding:0;flex:none;display:grid;place-items:center;background:var(--grad);color:#fff;font-family:inherit;font-weight:700;font-size:12.5px;line-height:1;cursor:pointer}
.top-av:hover{filter:brightness(1.08)}
.top-me .top-out svg{width:18px;height:18px}
.top-av:focus-visible,.top-me .top-out:focus-visible{outline:2px solid #5a8dee;outline-offset:2px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.av{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none;border:0}
.av.master{background:var(--grad)}
/* notifications list (bell) */
.nt-list{margin:-18px -20px}
.nt-list .hub-item{cursor:pointer}.nt-list .hub-item:hover{background:#faf9f6}
.nt-list .ii.bad{background:var(--badl);color:var(--bad)}.nt-list .ii.warn{background:var(--warnl);color:var(--warn)}
.nt-list .hub-note{padding:30px 20px}
/* iPad and narrow windows: a 72px rail with a short label under each icon */
@media (min-width:701px) and (max-width:900px){
 .app,.app.collapsed{grid-template-columns:72px minmax(0,1fr)}
 .app .side{padding:0}
 .app .wordmark,.app .nav-sep,.app .side-foot,.app .nav .cnt,.app .nav .lbl{display:none}
 .app .side .brand{justify-content:center;padding:18px 0 14px}
 .app .side .nav{padding:6px 10px}
 .app .side .nav a{height:56px;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:0 2px;font-size:15px}
 .app .side .nav a svg{width:18px;height:18px}
 .app .side .nav .slbl{display:block;font-size:10.5px;line-height:12px;font-weight:500;letter-spacing:-.1px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px}
 .top .tag{display:none}
}
/* phones: the same compact icon menu always on the left (60px; every button 50 x 52) */
@media (max-width:700px){
 .app,.app.collapsed{grid-template-columns:60px minmax(0,1fr)}
 .app .side{padding:10px 5px calc(10px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden}
 .app .side .brand{justify-content:center;padding:2px 0 10px;gap:0}
 .app .side .brand-mark{width:32px;height:23px;margin:0 auto}
 .app .wordmark,.app .nav-sep,.app .side-foot,.app .nav .cnt,.app .nav .lbl{display:none}
 .app .side .nav{padding:0;align-items:center;overflow:visible;flex:1 0 auto}
 .app .side .nav a{width:50px;height:52px;margin:0 auto;padding:0 1px;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-size:15px}
 .app .side .nav a svg{width:18px;height:18px}
 .app .side .nav .slbl{display:block;font-size:10px;line-height:12px;font-weight:500;letter-spacing:-.1px;text-align:center;white-space:nowrap;max-width:58px}
 .top{padding:8px 10px;gap:2px;row-gap:6px}
 .top h2{flex:1;max-width:none}
 .top .sp,.top .tag{display:none}
 .top .top-me{margin-left:4px;gap:2px}
 .top-av{width:32px;height:32px;font-size:12px}
 .icon-btn{width:36px;height:36px}
}
.content{flex:1;overflow:auto;padding:20px 22px 40px}
/* page header inside content */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.ph h1 span{color:inherit}
.content .ph h1{display:none}.content .ph.keep h1{display:block}
.content .ph:not(.keep) p{margin-top:0}
.ph p{margin:4px 0 0;color:var(--mut)}
/* buttons (primary = gradient, ghost = white bordered, as in the CRM apps) */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:var(--grad);color:#fff;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;line-height:1.3}
.btn:hover{filter:brightness(.95)}
.btn.ghost{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:#cfccc4;background:#fbfaf8;filter:none}
.btn.red{background:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.sel{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--card)}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.kpi .v small,.kpi .v span{font-size:12px;color:var(--mut);font-weight:500}
.kpi .s{font-size:12px;color:var(--mut);margin-top:4px}
.kpi.alert{background:#fff8f7;border-color:#f2c9c4}.kpi.alert .v{color:var(--bad)}
.banner{display:flex;align-items:center;gap:12px;background:#fdf3de;border:1px solid #f0d08a;border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
.banner b{display:block}
.banner .sp{flex:1}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.cols.eq{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px;min-width:0}
.card h3{margin:0 0 2px;font-size:15px;font-weight:650}
.card .sub{color:var(--mut);font-size:12.5px;margin-bottom:12px}
table{width:100%;border-collapse:separate;border-spacing:0}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:1;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
td b{font-weight:600}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#faf9f6}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:auto;max-height:72vh}
.card table td,.card table th{padding-left:6px;padding-right:6px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--greyl);color:var(--mut);white-space:nowrap}
.tag.bad{background:var(--badl);color:var(--bad)}.tag.warn{background:var(--warnl);color:var(--warn)}.tag.ok{background:var(--okl);color:var(--ok)}.tag.blue{background:var(--pri-l);color:var(--pri)}.tag.mute{background:var(--greyl);color:var(--mut)}.tag.pur{background:var(--purl);color:var(--pur)}
.chip{display:inline-flex;font-size:11px;font-weight:600;background:var(--warnl);color:#9a6400;border-radius:20px;padding:1px 8px;margin:1px 3px 1px 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input,.filters select{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--card);outline:0}
.filters input:focus,.filters select:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.filters .count{margin-left:auto;color:var(--mut);font-size:13px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:550;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 3px rgba(20,20,30,.12)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:7px}
.icbtn{border:0;background:none;color:var(--mut);padding:5px 7px;border-radius:7px;cursor:pointer}
.icbtn:hover{background:var(--bg);color:var(--ink)}
.empty{padding:50px 20px;text-align:center;color:var(--mut)}
.chart{position:relative}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#141418;color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .1s}
.hbar{display:grid;grid-template-columns:130px 1fr 56px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.hbar .tr{background:var(--greyl);border-radius:6px;height:12px}
.hbar .fl{background:var(--pri);height:100%;border-radius:6px}
.hbar b{text-align:right;font-weight:650}
/* modal = CRM drawer-card style */
.mb{position:fixed;inset:0;background:rgba(20,20,24,.35);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:100;overflow:auto}
.md{background:var(--card);border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(20,20,24,.25);overflow:hidden}
.md.wide{max-width:980px}
.md .mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.md .mh h2{margin:0;font-size:17px}
.md .mc{padding:18px 20px;max-height:70vh;overflow:auto}
.md .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.fld{margin-bottom:14px}
.fld label,.lb{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 6px}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 11px;outline:none}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
textarea.inp{min-height:76px;resize:vertical}
.rte{min-height:110px;line-height:1.5}.rte b{font-weight:800}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.algrid{display:flex;flex-wrap:wrap;gap:6px}
.algrid label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 11px;font-size:12.5px;margin:0;cursor:pointer;color:var(--ink);font-weight:500}
.algrid label input{display:none}
.algrid label.on{background:var(--pri-l);border-color:var(--pri);color:var(--pri);font-weight:600}
.hint{color:var(--mut);font-size:12.5px;line-height:1.5}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:#141418;color:#fff;padding:11px 18px;border-radius:10px;opacity:0;transition:all .2s;z-index:200;pointer-events:none;font-weight:500}
.toast.on{opacity:1;transform:translateX(-50%)}
/* phones: messages stay at the bottom, clear of the header and its site dropdown */
@media (max-width:700px){.toast{top:auto;bottom:calc(16px + env(safe-area-inset-bottom));max-width:calc(100vw - 32px);width:max-content;text-align:center}}
.matrix td,.matrix th{text-align:center;padding:7px 5px}
.matrix td:first-child,.matrix th:first-child{text-align:left;padding-left:14px}
.matrix th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:118px;vertical-align:bottom}
.yes{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:800}
.mc-dot{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:2px dashed #aaa;color:#777;font-size:9px;font-weight:800}
.row{display:flex;gap:10px;align-items:center}
.tgl{width:42px;height:24px;border-radius:12px;background:#cfccc4;position:relative;border:0;flex:none;cursor:pointer}
.tgl:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tgl.on{background:var(--pri)}.tgl.on:after{left:21px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:16px}
.setrow:last-child{border:0}
.setrow b{display:block;font-weight:600}

@media (max-width:700px){html .content{padding:14px 12px 36px}}
.ph h1,.content .ph.keep h1{font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--pv-text)}
.ph p,.content .ph.keep p{color:var(--pv-muted);font-size:14px}
/* buttons: primary (solid accent, no gradient) and secondary */
.btn{background:var(--pv-accent);color:var(--pv-on-accent);border:1px solid var(--pv-accent);padding:8px 14px;border-radius:10px;font-weight:600;line-height:20px;box-shadow:none}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--pv-surface);border-color:var(--pv-line);color:var(--pv-text)}
.btn.ghost:hover{background:var(--pv-surface);border-color:var(--pv-accent);filter:none}
.btn.red{background:var(--pv-bad-soft);color:var(--pv-bad);border-color:color-mix(in srgb,var(--pv-bad) 45%,transparent)}
.btn.sm{padding:4px 10px;font-size:12.5px;line-height:18px;border-radius:8px}
.content .ph.keep .btn{font-size:14px}
.sel,.inp,.filters input,.filters select,select.inp,textarea.inp{background:var(--pv-surface);border:1px solid var(--pv-line);border-radius:9px;color:var(--pv-text);padding:8px 10px}
.inp:focus,.filters input:focus,.filters select:focus,.sel:focus{border-color:var(--pv-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--pv-accent) 25%,transparent);outline:0}
.fld label,.lb{font-size:12.5px;font-weight:600;color:var(--pv-muted)}
.hint,.filters .count,.card .sub,.empty{color:var(--pv-muted)}
/* cards, stat cards, notices */
.card,.kpi,.tbl,.sc{background:var(--pv-surface);border:1px solid var(--pv-line);border-radius:12px;box-shadow:none}
.card{padding:16px}
.card h3{font-size:17px;font-weight:700}
.kpi{padding:12px 14px}
.kpi .l{font-size:13px;font-weight:600;color:var(--pv-text-2)}
.kpi .v{font-size:22px;font-weight:700}
.kpi .v small,.kpi .v span,.kpi .s{color:var(--pv-muted)}
.kpi.alert{background:var(--pv-bad-soft);border-color:color-mix(in srgb,var(--pv-bad) 40%,transparent)}
.kpi.alert .l,.kpi.alert .s{color:color-mix(in srgb,var(--pv-bad) 70%,var(--pv-text))}
.banner{background:var(--pv-warn-bg);border:1px solid var(--pv-warn-line);border-radius:12px}
.sc:hover{border-color:var(--pv-accent)}
.sc .meta,.sc .nums div{color:var(--pv-muted)}
.sc .nums span{color:var(--pv-text)}
.sc .go{color:var(--pv-accent-text)}
/* tables */
th,.content .ph.keep~.tbl th{background:var(--pv-surface);color:var(--pv-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--pv-line)}
td{border-bottom:1px solid var(--pv-line)}
tbody tr:hover td{background:var(--pv-surface-2)}
/* chips / tags */
.tag{border-radius:20px;font-size:12px;font-weight:600;padding:2px 9px;background:var(--pv-line);color:var(--pv-muted)}
.tag.bad{background:var(--pv-bad-soft);color:var(--pv-bad)}.tag.warn{background:var(--pv-warn-bg);color:var(--pv-warn)}.tag.ok{background:var(--pv-ok-soft);color:var(--pv-ok)}
.tag.blue{background:var(--pv-accent-soft);color:var(--pv-accent-text)}.tag.mute{background:var(--pv-line);color:var(--pv-muted)}.tag.pur{background:var(--purl);color:var(--pv-pur)}
.chip{background:var(--pv-warn-bg);color:var(--pv-warn);border-radius:20px;font-size:12px}
/* segmented tabs */
.seg{background:var(--pv-surface);border:1px solid var(--pv-line);border-radius:10px;padding:2px}
.seg button{padding:5px 11px;border-radius:8px;font-weight:600;color:var(--pv-muted)}
.seg button.on{background:var(--pv-accent-soft);color:var(--pv-accent-text);box-shadow:none}
.icbtn{color:var(--pv-muted)}.icbtn:hover{background:var(--pv-surface-2);color:var(--pv-text)}
.algrid label{background:var(--pv-surface);border-color:var(--pv-line);color:var(--pv-text)}
.algrid label.on{background:var(--pv-accent-soft);border-color:var(--pv-accent);color:var(--pv-accent-text)}
.tgl{background:var(--pv-line-2)}.tgl.on{background:var(--pv-accent)}
.setrow{border-bottom-color:var(--pv-line)}
.yes{background:var(--pv-text);color:var(--pv-bg)}
.mc-dot{border-color:var(--pv-muted);color:var(--pv-muted)}
pre{background:var(--pv-surface-2);color:var(--pv-text);border:1px solid var(--pv-line)}
/* charts: readable in both modes */
.chart svg line{stroke:var(--pv-line)}
.chart svg text{fill:var(--pv-muted)}
.chart svg g.b path{fill:var(--pv-accent)}
.chart svg g.b path.hi,.chart svg g.b:hover path{fill:color-mix(in srgb,var(--pv-accent) 70%,var(--pv-text))}
.tip,.toast{background:var(--pv-text);color:var(--pv-bg)}
.hbar .tr{background:var(--pv-surface-2)}.hbar .fl{background:var(--pv-accent)}
/* dialogs */
.mb{background:rgba(10,12,20,.55)}
.md{background:var(--pv-surface);border:1px solid var(--pv-line);border-radius:14px;box-shadow:var(--pv-shadow);color:var(--pv-text)}
.md .mh{border-bottom:1px solid var(--pv-line);padding:16px 20px}
.md .mh h2{font-size:18px;font-weight:700}
.md .mf{border-top:1px solid var(--pv-line)}
.nt-list .hub-item:hover{background:var(--pv-surface-2)}
.lab{border-color:var(--pv-line)}
/* sign in */
.auth2{color:var(--pv-text);background:var(--pv-bg)}
.auth2-art{background:var(--pv-side)}
.auth2-sub{color:#a9b3cf}
.art-glow{background:radial-gradient(circle,color-mix(in srgb,var(--main) 55%,transparent),transparent 65%)}
.auth2-form{background:var(--pv-bg)}
.auth2-form form{background:var(--pv-surface);border:1px solid var(--pv-line);border-radius:14px;box-shadow:none}
.auth2-brand .pv-brand{font-size:20px;flex:none}
.auth2-fbrand .pv-brand{color:var(--pv-text);font-size:20px;flex:none}
.auth2-fbrand .pv-brand i{color:var(--pv-accent-text)}
.auth2-form h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.auth2-mut{color:var(--pv-muted)}
.auth2-form label{color:var(--pv-text)}
.auth2-form .inp{height:42px;font-size:15px}
.auth2-form .go{height:42px;background:var(--pv-accent);color:var(--pv-on-accent);font-weight:600;border-radius:10px}
.auth2-form .go:hover{filter:brightness(1.07)}
.auth2-form .or{color:var(--pv-muted)}.auth2-form .or:before,.auth2-form .or:after{background:var(--pv-line)}
.auth2-form .ghost2{height:42px;background:var(--pv-surface);border:1px solid var(--pv-line);color:var(--pv-text);font-weight:600}
.auth2-form .ghost2:hover{background:var(--pv-surface);border-color:var(--pv-accent)}
.lg-err{background:var(--pv-bad-soft);color:var(--pv-bad)}
.lg-err.ok{background:var(--pv-ok-soft);color:var(--pv-ok)}
.demo .t{color:var(--pv-muted)}
.demo button{background:var(--pv-surface);border:1px solid var(--pv-line);color:var(--pv-text)}
.demo button:hover{border-color:var(--pv-accent)}
.demo small{color:var(--pv-muted)}
</style>
</head>

<div id="app"><div class="pv-splash" role="status" aria-label="Loading Proview Label"><div class="logo"></div></div></div>
<div id="modal"></div>

<script>/*CONFIG*/</script>
<script>/*CORE*/</script>

<script>/*HUB*/</script>
<script>
(function(){
'use strict';
const P=window.PVL, esc=P.esc, $=(s,r)=>(r||document).querySelector(s);
let S=P.load();
const day=864e5;
// ---------- accounts & access ----------
// Demo mode (no PVL_CONFIG, e.g. the Claude preview): sample accounts, stored in this browser.
// Cloud mode (hosted): Supabase Auth on the proview-label project + Proview account SSO; the server's
// row-level security enforces the same rules shown here.
const Cloud=window.PVLCloud||{enabled:false};
const CLOUD=!!Cloud.enabled;
if(CLOUD){ P.useStore('signed-out',{blank:true}); S=P.get(); }
const SKEY='pvl-session';
const lsGet=(k)=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} };
let sessionId=CLOUD?null:lsGet(SKEY);
let WHO=null;           // cloud: result of pl_whoami
let LOGIN={msg:'',kind:'bad',mode:'signin'};
let TRIAL_SETUP=false, TRIAL_EMAIL='';   // cloud: signed in with no business and no invite -> "Set up your business"
const ROLE_RANK={master:4,owner:3,admin:2,manager:1};
// role in a business: 'master' | 'owner' | 'admin' | 'manager' | null
function orgRole(orgId){
  if(CLOUD){ if(!WHO) return null; if(WHO.master) return (WHO.orgs||[]).some(x=>x.id===orgId)?'master':null; const o=(WHO.orgs||[]).find(x=>x.id===orgId); return o?o.role:null; }
  const u=P.byId('users',sessionId); if(!u) return null; if(u.role==='master') return 'master';
  return u.orgId===orgId?(u.role==='admin'?'admin':u.role==='manager'?'manager':null):null;
}
function me(){
  if(CLOUD){ if(!WHO) return null; const roles=(WHO.orgs||[]).map(o=>o.role); const top=WHO.master?'master':roles.sort((a,b)=>(ROLE_RANK[b]||0)-(ROLE_RANK[a]||0))[0]||'manager';
    return { id:'me', name:WHO.name||WHO.email, email:WHO.email, role:top==='owner'?'admin':top, rawRole:top }; }
  return P.byId('users',sessionId);
}
const isMaster=()=>!!me()&&me().role==='master';
const visibleOrgs=()=>(S.orgs||[]).filter(o=>orgRole(o.id));
// every site this person may open (the dropdown and access checks)
function mySiteIds(){
  if(!me()) return [];
  return P.live('sites').filter(s=>{ const r=orgRole(s.orgId); if(!r) return false; if(r!=='manager') return true;
    const ids=CLOUD?(((WHO.orgs||[]).find(o=>o.id===s.orgId)||{}).site_ids||[]):(me().siteIds||[]); return ids.includes(s.id); }).map(s=>s.id);
}
let siteFilter=(!CLOUD&&sessionId&&lsGet('pvl-site:'+sessionId))||'all';
// One business at a time (ONE_BUSINESS_RULE.md): pages only ever see the business that is open.
// Nothing is open on the master's All sites; everyone else always has one business open.
const scopeOrgIds=()=>{ if(siteFilter==='all') return []; if(siteFilter.startsWith('org:')) return [siteFilter.slice(4)]; const s=P.byId('sites',siteFilter); return s?[s.orgId]:[]; };
const curOrg=()=>{ const a=scopeOrgIds(); return a.length===1?a[0]:null; };
// the sites of the open business this person may see (every page uses this)
function allowedSiteIds(){ const o=scopeOrgIds(); return mySiteIds().filter(id=>o.includes((P.byId('sites',id)||{}).orgId)); }
const orgName=(id)=>(((S.orgs||[]).find(o=>o.id===id))||{}).name||'—';
function fixSite(){
  const a=mySiteIds(), orgs=visibleOrgs();
  if(siteFilter.startsWith('org:')){ if(!orgs.some(o=>'org:'+o.id===siteFilter)) siteFilter='all'; }
  else if(siteFilter!=='all'&&!a.includes(siteFilter)) siteFilter='all';
  if(siteFilter==='all'&&a.length===1&&!isMaster()) siteFilter=a[0];
  else if(siteFilter==='all'&&!isMaster()){ // business logins always have one business open (one at a time)
    const o=orgs.length===1?orgs[0].id:((P.byId('sites',a[0])||{}).orgId||(orgs[0]||{}).id); if(o) siteFilter='org:'+o; }
}
const onSitesPage=()=>isMaster()&&(location.hash||'#sites')==='#sites';
// picking a business or site from the master All sites page opens its Dashboard (All sites is only for "all")
function setSite(id){ siteFilter=id; lsSet('pvl-site:'+(CLOUD?(WHO&&WHO.email):sessionId),id); if(id!=='all'&&onSitesPage()){ location.hash='overview'; return; } render(); }
// Master on All sites (nothing picked): the usual pages are greyed out until a site is chosen in the header dropdown
const masterAll=()=>isMaster()&&siteFilter==='all';
function chooseSiteFirst(){ toast('Choose a location in the dropdown first'); const s=$('#sitePick'), w=$('.hdr-pick'); if(s) s.focus();
  if(w){ w.classList.remove('pulse'); void w.offsetWidth; w.classList.add('pulse'); clearTimeout(w._p); w._p=setTimeout(()=>w.classList.remove('pulse'),1000); } }
function goPage(k){ if(masterAll()&&k!=='sites') return chooseSiteFirst(); location.hash=k; }
function pickSite(id){ if(id==='all'&&isMaster()&&!onSitesPage()){ siteFilter='all'; lsSet('pvl-site:'+(CLOUD?(WHO&&WHO.email):sessionId),'all'); location.hash='sites'; return; }
  setSite(id); }
// A business must be chosen before creating catalogue items, sites or staff
function withOrg(cb){
  const o=curOrg(); if(o) return cb(o);
  const orgs=visibleOrgs().filter(x=>orgRole(x.id)!=='manager'||true);
  if(!orgs.length) return toast('No business to add this to yet.');
  const m=modal('Which business?',`<div class="fld"><label>Business</label><select class="inp" id="wo">${orgs.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></div><p class="hint">Tip: pick a business or location in the dropdown at the top and you won't be asked again.</p>`,`<button class="btn ghost" data-x>Cancel</button><button class="btn" id="wok">Continue</button>`);
  m.querySelector('#wok').onclick=()=>{ const v=m.querySelector('#wo').value; closeModal(); cb(v); };
}
function orgSettings(orgId){ const o=(S.orgs||[]).find(x=>x.id===orgId); return (o&&o.settings)||{}; }
async function setOrgSetting(orgId,k,v){ const o=(S.orgs||[]).find(x=>x.id===orgId); if(!o) return; o.settings={...(o.settings||{}),[k]:v}; P.save();
  if(CLOUD){ try{ await Cloud.saveOrgSettings(orgId,o.settings); }catch(e){ toast(Cloud.friendly(e)); } } }
const NAV=[
  ['',[['sites','Locations','pvloc']]],   // no section label above Locations (as Proview Signage)
  ['Service',[['overview','Dashboard','home'],['expiry','Expiry log','clock'],['printlog','Print log','print'],['wastage','Wastage','bin']]],
  ['Menu & labels',[['products','Products','tag'],['categories','Categories','grid'],['matrix','Allergen matrix','shield'],['analyser','Menu analyser','spark'],['rules','Expiry rules','snow']]],
  ['Manage',[['orders','Label orders','box'],['devices','Locations & devices','device'],['users','Users & permissions','users'],['history','Amendment history','hist'],['settings','Settings','gear']]]
];
const ICON={
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  print:'<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>',
  bin:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  tag:'<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',
  snow:'<path d="M12 2v20M4.9 6l14.2 12M4.9 18L19.1 6"/>',
  box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  device:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  hist:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 14H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 10h0a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  sync:'<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  pin:'<path d="M12 21s-7-6.1-7-11a7 7 0 1 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  pvloc:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M9 13h1M9 17h1M14 9h1M14 13h1M14 17h1"/>',
  left:'<path d="M15 18l-6-6 6-6"/>',
  pbottom:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15h18"/>',
  pleft:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>'
};
const ic=(k,s)=>`<svg width="${s||17}" height="${s||17}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]||''}</svg>`;
// Feature switches for managers (owners/admins always have everything). Keep keys in step with supabase/migrations/002.
const FEATURES=[['expiry','Expiry log'],['printlog','Print log'],['wastage','Wastage'],['products','Products, categories, allergens & menu analyser'],['rules','Expiry rules'],['orders','Label orders'],['devices','Locations & devices'],['users','Device staff (add, edit, remove)'],['history','Amendment history']];
const VIEW_FEATURE={expiry:'expiry',printlog:'printlog',wastage:'wastage',products:'products',categories:'products',matrix:'products',analyser:'products',rules:'rules',orders:'orders',devices:'devices',users:'users',history:'history'};
// true if the signed-in manager has this feature in at least one business they can see (missing key = on)
function hasFeature(f){ const u=me(); if(!u) return false; if(u.role!=='manager') return true;
  if(CLOUD){ return (WHO.orgs||[]).filter(o=>o.role==='manager').some(o=>((o.features||{})[f])!==false); }
  return ((u.features||{})[f])!==false; }
function canView(k){ const u=me(); if(!u) return false; if(k==='sites') return u.role==='master'; if(u.role==='manager'){ if(k==='settings') return false; const f=VIEW_FEATURE[k]; return !f||hasFeature(f); } return true; }
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400);}
// records tied to a site (labels, wastage, orders, devices) follow the picker; others follow the business
const bySite=(arr)=>{ const a=allowedSiteIds(), orgs=scopeOrgIds();
  return arr.filter(x=>{ if(x.siteId){ if(!a.includes(x.siteId)) return false; if(siteFilter==='all') return true; if(siteFilter.startsWith('org:')) return orgs.includes((P.byId('sites',x.siteId)||{}).orgId); return x.siteId===siteFilter; }
    return !x.orgId||orgs.includes(x.orgId); }); };
const byOrg=(arr)=>{ const orgs=scopeOrgIds(); return arr.filter(x=>orgs.includes(x.orgId)); };
const multiOrg=()=>scopeOrgIds().length>1;
const COLL_KEYS=['sites','categories','products','rules','users','labels','wastage','orders','devices','audit'];
const siteName=(id)=>(P.byId('sites',id)||{}).name||'—';
const userName=(id)=>(P.byId('users',id)||{}).name||'—';
const catOf=(p)=>P.byId('categories',p.categoryId)||{};
function route(){ const h=(location.hash||(isMaster()?'#sites':'#overview')).slice(1); const r=VIEWS[h]&&canView(h)?h:'overview';
  if(masterAll()) return 'sites';
  if(r==='overview'&&isMaster()&&(!visibleOrgs().length||(siteFilter==='all'&&!mySiteIds().length))) return 'sites';
  return r; }

function siteStats(id){
  const ls=P.live('labels').filter(l=>l.siteId===id); const today=new Date().toDateString();
  const act=ls.filter(l=>l.type==='prep'&&(!l.status||l.status==='active'));
  const devs=P.live('devices').filter(d=>d.siteId===id);
  const last=devs.map(d=>d.lastSync).filter(Boolean).sort().pop();
  return { today: ls.filter(l=>new Date(l.printedAt).toDateString()===today).reduce((a,l)=>a+(+l.qty||1),0),
    expired: act.filter(l=>P.expiryStatus(l)==='expired').length, soon: act.filter(l=>P.expiryStatus(l)==='today').length,

    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="#EEF1F4"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="10.5" fill="#69727D">${t}</text>`).join('')}
    ${data.map((d,i)=>{ const x=pl+i*bw+bw*0.18, w=bw*0.64, h=Math.max(0,(H-pt-pb)-(y(d.v)-pt)); return `<g class="b" data-i="${i}"><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent"/><path d="M${x},${H-pb} V${y(d.v)+Math.min(4,h)} q0,-4 4,-4 h${w-8} q4,0 4,4 V${H-pb} Z" class="${d.hi?'hi':''}" fill="${d.hi?'#3a59b8':'#4a6cd0'}" opacity="${d.v?1:.25}"/></g>${(i%2===data.length%2||data.length<10)?`<text x="${pl+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#69727D">${esc(d.k)}</text>`:''}`; }).join('')}
    <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="#CFD5DB"/></svg><div class="tip"></div></div>`;
  const tip=el.querySelector('.tip'), svg=el.querySelector('svg');
  el.querySelectorAll('g.b').forEach(g=>{ g.onmouseenter=()=>{ const d=data[+g.dataset.i]; tip.innerHTML=`<b>${esc(d.full||d.k)}</b><br>${d.v} ${esc(opts.unit)}`; const r=svg.getBoundingClientRect(); const sc=r.width/W; tip.style.left=((pl+(+g.dataset.i+.5)*bw)*sc)+'px'; tip.style.top=(y(d.v)*sc)+'px'; tip.style.opacity=1; g.querySelector('path').setAttribute('fill','#3a59b8'); };
    g.onmouseleave=()=>{ tip.style.opacity=0; g.querySelector('path').setAttribute('fill',data[+g.dataset.i].hi?'#3a59b8':'#4a6cd0'); }; });
}

function importProductsCSV(text,orgId){
  const rows=P.parseCSV(text); let added=0, updated=0, newCats=0;
  rows.forEach(r=>{
    if(!r.name) return;
    const type=(r.type||'prep').toLowerCase().startsWith('s')?'sale':'prep';
    let c=P.live('categories').filter(x=>x.orgId===orgId).find(x=>x.name.toLowerCase()===(r.category||'Imported').toLowerCase()&&x.type===type);
    if(!c){ c=P.upsert('categories',{id:P.uid('c_'),orgId,name:r.category||'Imported',type,color:type==='sale'?'#1E3A5F':'#546E7A'}); newCats++; }
    const ex=P.live('products').find(p=>p.name.toLowerCase()===r.name.toLowerCase()&&p.categoryId===c.id);
    const ing=r.ingredients?P.boldAllergens(r.ingredients):'';
    const listed=(r.allergens||'').split(/[;|,]/).map(s=>s.trim()).filter(Boolean).map(s=>P.ALLERGENS.find(a=>a.toLowerCase()===s.toLowerCase()||(P.ALLERGEN_LABEL[a]||'').toLowerCase()===s.toLowerCase())).filter(Boolean);
    const rule=P.live('rules').filter(x=>x.orgId===orgId).find(x=>x.name.toLowerCase()===(r.expiry_rule||'').toLowerCase());
    const rec={...(ex||{id:P.uid('p_'),timesPrinted:0}),orgId,categoryId:c.id,name:r.name,ingredients:ing,allergens:[...new Set([...listed,...P.detectAllergens(ing)])],mayContain:r.may_contain||'',customAllergens:r.custom_allergens||'',price:r.price?parseFloat(r.price):null,barcode:r.barcode||'',ruleId:rule?rule.id:null,dateType:'use-by',approved:true};
    P.upsert('products',rec); ex?updated++:added++;
  });
  audit('imported','Products',`CSV: ${added} added, ${updated} updated`,orgId);
  toast(`${added} added, ${updated} updated${newCats?', '+newCats+' new categories':''}`); render();
}

function logFilters(){ return `<div class="filters"><input id="lq" placeholder="Search product, code, batch" value="${esc(lf.q)}"><select id="lr">${[['1','Today'],['7','Last 7 days'],['30','Last 30 days'],['all','All time']].map(([v,l])=>`<option value="${v}" ${lf.range===v?'selected':''}>${l}</option>`).join('')}</select><select id="lu"><option value="all">All staff</option>${byOrg(P.live('users')).map(u=>`<option value="${u.id}" ${lf.user===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select><select id="lt"><option value="all">Prep & sale</option><option value="prep" ${lf.type==='prep'?'selected':''}>Prep</option><option value="sale" ${lf.type==='sale'?'selected':''}>Sale</option></select></div>`; }

// Master: extend, end now or clear (= licensed, no longer a trial) a business's free trial
function trialForm(orgId){ const o=(S.orgs||[]).find(x=>x.id===orgId); if(!o) return;
  const ymd=(d)=>{ const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
  const base=Math.max(Date.now(),o.trial_ends_at?new Date(o.trial_ends_at).getTime():0);
  const m=modal('Trial · '+o.name,`<p style="margin-top:0">Status: ${stateTag(o)}${o.trial_ends_at?` <span class="hint">ends ${esc(P.fmtDate(o.trial_ends_at,true))}</span>`:' <span class="hint">not a trial (licensed)</span>'}</p>
    <div class="fld"><label>Trial ends on</label><input class="inp" type="date" id="te" value="${ymd(base+3*day)}"></div>
    <div class="btns" style="margin-bottom:6px"><button class="btn ghost sm" data-add="3">+3 days</button><button class="btn ghost sm" data-add="7">+7 days</button><button class="btn ghost sm" data-add="30">+30 days</button></div>
    <p class="hint">The trial ends at the end of that day. After it ends the business is read-only and its people see “Trial ended” with the licence portal and Proview contact details. Clear the trial once they have a licence.</p>`,
    `<button class="btn ghost" data-x>Cancel</button>${o.trial_ends_at?'<button class="btn ghost" id="tclr">Clear trial (licensed)</button>':''}<button class="btn" id="tsv">Save end date</button>`);
  m.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ m.querySelector('#te').value=ymd(base+(+b.dataset.add)*day); });
  const save=async(ends)=>{ try{ if(CLOUD){ await Cloud.setTrial(orgId,ends); await refreshWho(); } else { o.trial_ends_at=ends; o.trial_expired=!!ends&&new Date(ends)<new Date(); P.save(); }
      closeModal(); toast(ends?'Trial now ends '+P.fmtDate(ends,true):'Trial cleared: '+o.name+' is licensed'); render(); }catch(e){ toast(Cloud.friendly?Cloud.friendly(e):e.message); } };
  m.querySelector('#tsv').onclick=()=>{ const v=m.querySelector('#te').value; if(!v) return toast('Pick a date'); const d=new Date(v+'T23:59:59'); if(isNaN(d)) return toast('Pick a date'); save(d.toISOString()); };
  const c=m.querySelector('#tclr'); if(c) c.onclick=()=>save(null);
}

      <table><thead><tr><th>Name</th><th>On device</th>${multiOrg()?'<th>Business</th>':''}<th>Locations</th><th>Labels printed</th><th></th></tr></thead><tbody>${staff.map(u=>`<tr><td><div class="row"><div class="av">${esc(P.initials(u.name))}</div><b>${esc(u.name)}</b></div></td><td>${roleTag(u.role)}</td>${multiOrg()?`<td class="hint">${esc(orgName(u.orgId))}</td>`:''}<td>${(u.siteIds||[]).map(siteName).map(esc).join(', ')}</td><td>${P.live('labels').filter(l=>l.userId===u.id).reduce((a,l)=>a+(+l.qty||1),0)}</td><td style="text-align:right"><button class="icbtn" data-ed="${u.id}">✎</button><button class="icbtn" data-del="${u.id}">🗑</button></td></tr>`).join('')||`<tr><td colspan="6" class="empty">No device staff yet.</td></tr>`}</tbody></table></div>
  </div>
  <div class="card" style="align-self:start"><h3>Permissions</h3><div class="sub">${org?'Apply to every device at '+esc(orgName(org)):'Pick one business in the picker to change its permissions.'}</div>
    ${[['requirePhoto','Require a photo for wastage','Staff must attach a photo before logging wastage'],['requireApproval','Approve new products','Products added from the menu analyser or devices wait for a manager'],['staffCanEdit','Staff can edit products','Off: only managers can add or change products on devices']].map(([k,t,d])=>`<div class="setrow"><div><b>${t}</b><span class="hint">${d}</span></div><button class="tgl ${st[k]?'on':''}" data-set="${k}" ${org&&['master','owner','admin'].includes(orgRole(org))?'':'disabled style="opacity:.4"'} aria-label="${t}"></button></div>`).join('')}
    <div class="sub" style="margin-top:12px"><b>Owner/Admin</b> everything in their business · <b>Manager</b> their own locations and the features you switch on, no settings · <b>Master</b> (Proview) every business</div></div></div>`;
  // logins table (async in cloud mode)
  (async()=>{ const box=el.querySelector('#logins'); let rows=[];
    try{ rows=await Logins.list(orgIds); }catch(e){ box.innerHTML=`<div class="lg-err">${esc(Cloud.friendly(e))}</div>`; return; }
    rows=rows.filter(m=>['master','owner','admin'].includes(orgRole(m.org_id))||m.site_ids.some(id=>allowedSiteIds().includes(id))||m.email===(me().email||''));
    box.innerHTML=`<table><thead><tr><th>Name</th><th>Role</th>${multiOrg()?'<th>Business</th>':''}<th>Locations</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(m=>`<tr><td><b>${esc(m.name||m.email)}</b><div class="hint">${esc(m.email)}</div></td><td>${roleTag(m.role)}</td>${multiOrg()?`<td class="hint">${esc(orgName(m.org_id))}</td>`:''}<td>${m.role==='manager'?(m.site_ids||[]).map(siteName).map(esc).join(', ')||'<span class="hint">None yet</span>':'<span class="hint">All locations</span>'}${m.role==='manager'?(()=>{ const off=FEATURES.filter(([k])=>((m.features||{})[k])===false); return `<div class="hint">${off.length?'No access to: '+off.map(([,l])=>esc(l.split(',')[0])).join(', '):'All features'}</div>`; })():''}</td><td>${m.active?'<span class="tag ok">Active</span>':'<span class="tag warn">Invited</span>'}</td><td style="text-align:right">${['master','owner','admin'].includes(orgRole(m.org_id))?`<button class="icbtn" data-em="${m.id}">✎</button><button class="icbtn" data-dm="${m.id}">🗑</button>`:''}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">No logins yet.</td></tr>`}</tbody></table>`;
    box.querySelectorAll('[data-em]').forEach(b=>b.onclick=()=>loginForm(rows.find(x=>x.id===b.dataset.em)));
    box.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{ const m=rows.find(x=>x.id===b.dataset.dm); confirmM('Remove '+(m.name||m.email)+'?','They will no longer be able to sign in to Proview Label for '+orgName(m.org_id)+'.','Remove',async()=>{ try{ await Logins.remove(m); audit('deleted','Login',m.email,m.org_id); render(); }catch(e){ toast(Cloud.friendly(e)); } }); });
  })();
  const loginForm=(m,orgId)=>{ const isNew=!m; m=m||{org_id:orgId,email:'',name:'',role:'manager',site_ids:[]}; const sites=P.live('sites').filter(x=>x.orgId===m.org_id);
    const roles=[['owner','Owner'],['admin','Admin'],['manager','Manager']].filter(([k])=>k!=='owner'||['master','owner'].includes(orgRole(m.org_id)));
    const md=modal((isNew?'Add back-office login':'Edit login')+' · '+orgName(m.org_id),`<div class="g2"><div class="fld"><label>Name</label><input class="inp" id="n" value="${esc(m.name)}"></div><div class="fld"><label>Email</label><input class="inp" id="e" type="email" value="${esc(m.email)}" ${isNew?'':'disabled'}></div></div>
      <div class="fld"><label>Role</label><select class="inp" id="r">${roles.map(([k,v])=>`<option value="${k}" ${m.role===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div id="sb"><div class="lb">Locations they can use</div><div class="algrid" id="sitesG">${sites.map(x=>`<label class="${(m.site_ids||[]).includes(x.id)?'on':''}"><input type="checkbox" value="${x.id}" ${(m.site_ids||[]).includes(x.id)?'checked':''}>${esc(x.name)}</label>`).join('')||'<span class="hint">Add a location first.</span>'}</div>
        <div class="lb" style="margin-top:14px">What this manager can use</div><div class="algrid" id="featG">${FEATURES.map(([k,l])=>{ const on=((m.features||{})[k])!==false; return `<label class="${on?'on':''}"><input type="checkbox" data-f="${k}" ${on?'checked':''}>${esc(l)}</label>`; }).join('')}</div>
        <p class="hint">Owners and admins always have every feature. Settings is owner/admin only.</p></div>
      ${isNew?'<p class="hint" style="margin-top:12px">They sign in at label.proviewcrm.co.uk with “Sign in with Proview account” (same login as your other Proview apps), or “Create a login” with this email.</p>':''}`,`<button class="btn ghost" data-x>Cancel</button><button class="btn" id="sv">${isNew?'Add login':'Save'}</button>`);
    const sync=()=>md.querySelector('#sb').style.display=md.querySelector('#r').value==='manager'?'':'none'; sync(); md.querySelector('#r').onchange=sync;
    md.querySelectorAll('.algrid input').forEach(cb=>cb.onchange=()=>cb.parentElement.classList.toggle('on',cb.checked));
    md.querySelector('#sv').onclick=async()=>{ const e=md.querySelector('#e').value.trim().toLowerCase(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return toast('Enter a valid email');
      const rec={...m,email:e,name:md.querySelector('#n').value.trim(),role:md.querySelector('#r').value,site_ids:[...md.querySelectorAll('#sitesG input:checked')].map(x=>x.value),features:Object.fromEntries([...md.querySelectorAll('#featG input')].map(x=>[x.dataset.f,x.checked]))};
      if(rec.role==='manager'&&!rec.site_ids.length) return toast('Pick at least one location for a manager');
      try{ await Logins.save(rec); audit(isNew?'created':'updated','Login',e+' ('+rec.role+')',rec.org_id); closeModal(); toast(isNew?'Login added':'Saved'); render(); }catch(ex){ toast(Cloud.friendly?Cloud.friendly(ex):ex.message); } }; };
  const staffForm=(u,orgId)=>{ const isNew=!u; u=u||{id:P.uid('u_'),orgId,name:'',role:'staff',pin:'',siteIds:allowedSiteIds().filter(id=>(P.byId('sites',id)||{}).orgId===orgId&&(siteFilter===id||!P.byId('sites',siteFilter))).slice(0,1)};
    const sites=P.live('sites').filter(x=>x.orgId===u.orgId&&allowedSiteIds().includes(x.id));
    const md=modal((isNew?'Add device staff':'Edit device staff')+(multiOrg()||isMaster()?' · '+orgName(u.orgId):''),`<div class="g2"><div class="fld"><label>Name</label><input class="inp" id="n" value="${esc(u.name)}"></div><div class="fld"><label>4-digit PIN</label><input class="inp" id="p" value="${esc(u.pin)}" maxlength="4" inputmode="numeric"></div></div><div class="fld"><label>On the device</label><select class="inp" id="r"><option value="staff">Staff</option><option value="manager" ${u.role==='manager'?'selected':''}>Manager (can edit products)</option></select></div><div class="lb">Locations they can use</div><div class="algrid">${sites.map(x=>`<label class="${(u.siteIds||[]).includes(x.id)?'on':''}"><input type="checkbox" value="${x.id}" ${(u.siteIds||[]).includes(x.id)?'checked':''}>${esc(x.name)}</label>`).join('')}</div>`,`<button class="btn ghost" data-x>Cancel</button><button class="btn" id="sv">Save</button>`);
    md.querySelectorAll('.algrid input').forEach(cb=>cb.onchange=()=>cb.parentElement.classList.toggle('on',cb.checked));
    md.querySelector('#sv').onclick=()=>{ u.name=md.querySelector('#n').value.trim(); u.pin=md.querySelector('#p').value.trim(); u.role=md.querySelector('#r').value; u.siteIds=[...md.querySelectorAll('.algrid input:checked')].map(x=>x.value);
      if(!u.name) return toast('Enter a name'); if(!/^\d{4}$/.test(u.pin)) return toast('PIN must be 4 digits'); if(!u.siteIds.length) return toast('Pick at least one location');
      if(P.live('users').some(x=>x.id!==u.id&&x.pin===u.pin&&x.orgId===u.orgId&&(x.siteIds||[]).some(id=>u.siteIds.includes(id)))) return toast('Someone at that location already uses this PIN');
      P.upsert('users',u); audit(isNew?'created':'updated','Device staff',u.name,u.orgId); closeModal(); render(); }; };
  const al=el.querySelector('#addL'); if(al) al.onclick=()=>withOrg(o=>{ if(!['master','owner','admin'].includes(orgRole(o))) return toast('Only an owner or admin can add logins.'); loginForm(null,o); });
  el.querySelector('#addU').onclick=()=>withOrg(o=>staffForm(null,o));
  el.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>staffForm({...P.byId('users',b.dataset.ed)}));
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const u=P.byId('users',b.dataset.del); confirmM('Remove '+u.name+'?','They will no longer be able to sign in on the devices.','Remove',()=>{P.remove('users',u.id);audit('deleted','Device staff',u.name,u.orgId);render();}); });
  el.querySelectorAll('[data-set]').forEach(b=>b.onclick=async()=>{ if(!org||b.disabled) return; await setOrgSetting(org,b.dataset.set,!st[b.dataset.set]); audit('updated','Permission',b.dataset.set+': '+(!st[b.dataset.set]?'on':'off'),org); render(); });
};

VIEWS.settings=(el)=>{
  const sy=S.settings.sync;
  el.innerHTML=`<div class="ph"><div><h1>Settings</h1><p>Your account, the connection devices sync through, and data tools.</p></div></div>
  <div class="cols eq">
    <div class="card"><h3>Your account</h3><div class="sub">${esc(me().email||me().name)} · ${me().rawRole==='owner'?'Owner':P.ROLES[me().role]}</div>
      ${CLOUD?`<div class="setrow"><div><b>Password</b><span class="hint">Change the password for this Proview Label login.</span></div><button class="btn ghost sm" id="chg">Change</button></div>
      <div class="setrow"><div><b>Proview account</b><span class="hint">The same email signs in to Bookings, Employee, Signage and WiFi via dashboard.proviewcrm.co.uk.</span></div><a class="btn ghost sm" href="https://dashboard.proviewcrm.co.uk/" target="_blank" rel="noopener">Open</a></div>`:`<p class="hint">Demo account. In the hosted back-office you sign in with your email or your Proview account.</p>`}
      <div class="setrow"><div><b>Proview support</b><span class="hint">020 8935 5495 · info@proviewtechgroup.co.uk · Mon–Fri 9am–5pm</span></div></div></div>
    <div class="card"><h3>Cloud</h3>
      ${CLOUD?`<div class="sub">Connected to the Proview Label server (London). Devices and this back-office stay in step automatically.</div>
        <div class="setrow"><div><b>Last sync</b><span class="hint">${sy.lastSync?P.fmtDate(sy.lastSync,true):'Not yet'} · checks every minute and after every change</span></div><button class="btn sm" id="sn">Sync now</button></div>
        <div class="setrow"><div><b>Connect a handheld</b><span class="hint">On the device: Menu → Settings → Connect to Proview Label, then sign in with a back-office login and pick the location.</span></div></div>`
      :`<div class="sub">This preview runs on sample data saved in this browser. The hosted back-office (label.proviewcrm.co.uk) uses live accounts and syncs with every device.</div>
        <div class="setrow"><div><b>Sample data</b><span class="hint">Put back the demo businesses, locations, products and 14 days of activity.</span></div><button class="btn red sm" id="rst">Reset demo data</button></div>`}
    </div></div>`;
  const chg=el.querySelector('#chg'); if(chg) chg.onclick=()=>{ const m=modal('Change password',`<div class="fld"><label>New password</label><input class="inp" id="a" type="password" autocomplete="new-password"></div><div class="fld"><label>Confirm</label><input class="inp" id="b" type="password" autocomplete="new-password"></div>`,`<button class="btn ghost" data-x>Cancel</button><button class="btn" id="sv">Save</button>`);
    m.querySelector('#sv').onclick=async()=>{ const a=m.querySelector('#a').value; if(a.length<8) return toast('Use at least 8 characters'); if(a!==m.querySelector('#b').value) return toast('The passwords don’t match'); try{ await Cloud.setPassword(a); closeModal(); toast('Password changed'); }catch(e){ toast(Cloud.friendly(e)); } }; };
  const sn=el.querySelector('#sn'); if(sn) sn.onclick=()=>doSync(false);
  const rst=el.querySelector('#rst'); if(rst) rst.onclick=()=>confirmM('Reset demo data?','All changes in this browser are replaced with the sample data.','Reset',()=>{P.reset();toast('Demo data restored');render();});
};

if(CLOUD){
  Cloud.onRecovery(()=>{ LOGIN={msg:'',kind:'bad',mode:'newpw'}; WHO=null; renderLogin(); });
  splash();
  (async()=>{
    try{ await Cloud.consumeSsoHash(); }catch(e){ LOGIN={msg:e.message,kind:'bad',mode:'signin'}; }
    const hp=new URLSearchParams(location.hash.slice(1));
    if(hp.get('type')==='recovery'){ LOGIN={msg:'',kind:'bad',mode:'newpw'}; return renderLogin(); }
    if(hp.get('error_description')) LOGIN={msg:'That link didn’t work: '+hp.get('error_description'),kind:'bad',mode:'signin'};
    if(await Cloud.user()) boot(); else render();
  })();
} else render();
window.__pvd={render,get WHO(){return WHO;}};
})();
</script>
