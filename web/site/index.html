<!-- no web font: the system font stack, the same as Proview Signage and the other Proview apps -->
<style>
/* Proview CRM family theme (same tokens as Proview Bookings / Employee / Signage) */
:root{--pri:#4a6cd0;--pri-d:#3a59b8;--pri-l:#edf2fd;--grad:linear-gradient(135deg,#2f84d4 0%,#5a5fbb 100%);--grad-light:linear-gradient(90deg,#62b0ec 0%,#8b88dc 100%);
  --navy:#141418;--navy2:#26262e;--bg:#f4f3ef;--card:#fff;--ink:#17171c;--mut:#55555f;--line:#e4e2dc;
  --ok:#12a150;--okl:#e7f6ed;--warn:#d48a00;--warnl:#fdf3de;--bad:#d92d20;--badl:#fdf0ef;--pur:#6d5fc4;--purl:#efedfb;--grey:#8b8b95;--greyl:#efeee9;
  --font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;--r:12px;--sh:0 1px 2px rgba(20,20,30,.06),0 4px 16px rgba(20,20,30,.05)}
*{box-sizing:border-box}
html,body{height:100%}
/* loading splash: only the app icon, centred on the page background, until the sign-in state is known
   (same as the other Proview apps: 72px icon, page background, 1.2s pulse as Proview Bookings) */
.pv-splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:300}
.pv-splash .logo{width:72px;height:72px;opacity:.9;animation:pvsplash 1.2s ease-in-out infinite}
@keyframes pvsplash{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pv-splash .logo{animation:none}}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--pri)}
/* ===== Proview app shell: the same menu, header tray and breakpoints as Proview Signage and Bookings =====
   desktop: 236px menu (COLLAPSE to a 72px icon rail) · 701-900px: 72px labelled rail · phones: 60px labelled rail
   the site drop-down is always in the header, straight after the page title (as in Proview WiFi); phones: own second header row */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100vh;height:100dvh}
.side{background:#141418;color:#c9c9d1;display:flex;flex-direction:column;overflow:hidden;min-height:0;font-size:15px}
.side .brand{display:flex;align-items:center;gap:10px;padding:18px 10px 14px 14px;color:#fff;text-decoration:none;flex:none}

.wordmark{letter-spacing:.04em;font-size:15px;line-height:20px;white-space:nowrap;font-weight:500;color:#fff}
.wordmark span{background:var(--grad-light);-webkit-background-clip:text;background-clip:text;color:transparent}
.side .nav{flex:1;min-height:0;overflow:auto;padding:6px 10px;display:flex;flex-direction:column}
.side .nav-sep{font-size:11px;line-height:13px;letter-spacing:.08em;text-transform:uppercase;color:#6e6e78;padding:10px 10px 3px;flex:none}
.side .nav a{display:flex;align-items:center;gap:10px;height:30px;flex:none;box-sizing:border-box;padding:0 12px;border-radius:9px;color:#c9c9d1;text-decoration:none;font-size:14px;font-weight:550;line-height:22px;position:relative}
.side .nav a svg{width:16px;height:16px;flex:none}
.side .nav a:hover{background:#1f1f25;color:#fff}
.side .nav a.active{background:#26262e;color:#fff}
.side .nav a.active svg{color:var(--pri)}
.side .nav a.off{opacity:.45;cursor:not-allowed}
.side .nav a.off:hover{background:none;color:#c9c9d1}
.top .hdr-pick.pulse select{animation:hdr-pick-pulse 1s ease-out}
@keyframes hdr-pick-pulse{0%,60%{box-shadow:0 0 0 3px rgba(90,141,238,.55);border-color:#5a8dee}100%{box-shadow:0 0 0 0 rgba(90,141,238,0)}}
.side .nav .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .nav .slbl{display:none}
.side .nav .cnt{margin-left:auto;font-size:11px;line-height:16px;font-weight:600;background:rgba(255,255,255,.12);padding:0 7px;border-radius:10px}
.side .nav .cnt.red{background:var(--bad);color:#fff}
.side-foot{display:flex;align-items:center;padding:0 10px 14px;flex:none}
.sf-link{display:flex;align-items:center;gap:6px;background:none;border:0;color:#8b8b95;letter-spacing:.06em;font-size:12px;font-weight:600;line-height:17px;padding:6px 8px;border-radius:9px;cursor:pointer;font-family:inherit}
.sf-link:hover{color:#fff}.sf-link svg{width:14px;height:14px;flex:none}
.app.collapsed{grid-template-columns:72px minmax(0,1fr)}
@media (min-width:901px){
 .app.collapsed .side{padding:18px 10px}
 .app.collapsed .wordmark,.app.collapsed .nav-sep,.app.collapsed .nav .lbl,.app.collapsed .nav .cnt,.app.collapsed .sf-link .lbl{display:none}
 .app.collapsed .side .brand{justify-content:center;padding:4px 0 18px}
 .app.collapsed .side .nav a{justify-content:center;padding:0}
 .app.collapsed .side-foot{flex-direction:column;gap:4px;padding:0 0 14px}
 .app.collapsed .sf-link{width:30px;height:26px;padding:0;justify-content:center}
 .app.collapsed .sf-link svg{transform:rotate(180deg)}
}
/* main column and header */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line);min-height:62px;box-sizing:border-box;flex:none;font-size:15px;position:relative;z-index:20}
.top h2{font-size:18px;font-weight:700;letter-spacing:-.015em;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .sp{flex:1}
.top h2{flex:none;max-width:40%}
/* site picker: in the top header right after the page title, on every screen size (same as Proview WiFi;
   Bookings and Label use the same .hdr-pick markup and rules) */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.top .hdr-pick { margin: 0 0 0 6px; flex: 0 1 auto; min-width: 0; }
.top .hdr-pick select { display: block; width: auto; height: 38px; max-width: 320px; min-width: 170px; border-radius: 10px; border: 1px solid var(--line); background-color: #fff; color: var(--ink); font: 600 14px var(--font); padding: 0 30px 0 12px; cursor: pointer; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
.top .hdr-pick select:focus { outline: none; border-color: var(--line); }
.top .hdr-pick select:focus-visible { outline: 2px solid #5a8dee; outline-offset: 2px; }
.top .hdr-pick select:disabled { opacity: 1; cursor: default; color: var(--ink); appearance: none; -webkit-appearance: none; padding-right: 12px; }
/* iPad / narrow desktop: the title keeps its width and the picker shrinks (to its 170px minimum) to fit (as Signage) */
@media (min-width: 701px) { .top h2 { flex-shrink: 0; } .top .hdr-pick select { max-width: min(320px, 100%); } }
/* phones: the tray leaves no room on the title row, so the picker gets the header's second row, full width */
@media (max-width: 700px) {
  .top { flex-wrap: wrap; row-gap: 6px; }
  .top .hdr-pick { order: 1; flex: 1 0 100%; margin: 0; }
  .top .hdr-pick select { width: 100%; min-width: 0; max-width: none; height: 36px; font-size: 13px; }
}
/* Label only: the box can shrink (not below 170px) so it never runs under the tray on iPad */
.top .hdr-pick{display:flex}
.hdr-pick+.tag{flex:none}
.hdr-dot[role=button]{cursor:pointer}
/* bell count: the same blue badge as Proview Signage (.bell-dot) */
.top .bell{color:var(--ink);margin-left:0}
.bell .bell-dot{position:absolute;top:1px;right:-2px}
.bell-dot{min-width:18px;height:18px;border-radius:9px;background:var(--grad);color:#fff;font:700 11px/18px var(--font);padding:0 5px;text-align:center}
.bell-dot.hidden{display:none}
.icon-btn{position:relative;background:none;border:1px solid transparent;border-radius:10px;width:38px;height:38px;padding:0;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--bg);border-color:var(--line)}
.top .top-me{display:flex;align-items:center;gap:4px;margin-left:8px;flex:none}
.top-av{width:34px;height:34px;border-radius:50%;border:0;padding:0;flex:none;display:grid;place-items:center;background:var(--grad);color:#fff;font-family:inherit;font-weight:700;font-size:12.5px;line-height:1;cursor:pointer}
.top-av:hover{filter:brightness(1.08)}
.top-me .top-out svg{width:18px;height:18px}
.top-av:focus-visible,.top-me .top-out:focus-visible{outline:2px solid #5a8dee;outline-offset:2px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.av{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none;border:0}
.av.master{background:var(--grad)}
/* notifications list (bell) */
.nt-list{margin:-18px -20px}
.nt-list .hub-item{cursor:pointer}.nt-list .hub-item:hover{background:#faf9f6}
.nt-list .ii.bad{background:var(--badl);color:var(--bad)}.nt-list .ii.warn{background:var(--warnl);color:var(--warn)}
.nt-list .hub-note{padding:30px 20px}
/* iPad and narrow windows: a 72px rail with a short label under each icon */
@media (min-width:701px) and (max-width:900px){
 .app,.app.collapsed{grid-template-columns:72px minmax(0,1fr)}
 .app .side{padding:0}
 .app .wordmark,.app .nav-sep,.app .side-foot,.app .nav .cnt,.app .nav .lbl{display:none}
 .app .side .brand{justify-content:center;padding:18px 0 14px}
 .app .side .nav{padding:6px 10px}
 .app .side .nav a{height:56px;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:0 2px;font-size:15px}
 .app .side .nav a svg{width:18px;height:18px}
 .app .side .nav .slbl{display:block;font-size:10.5px;line-height:12px;font-weight:500;letter-spacing:-.1px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px}
 .top .tag{display:none}
}
/* phones: the same compact icon menu always on the left (60px; every button 50 x 52) */
@media (max-width:700px){
 .app,.app.collapsed{grid-template-columns:60px minmax(0,1fr)}
 .app .side{padding:10px 5px calc(10px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden}
 .app .side .brand{justify-content:center;padding:2px 0 10px;gap:0}
 .app .side .brand-mark{width:32px;height:23px;margin:0 auto}
 .app .wordmark,.app .nav-sep,.app .side-foot,.app .nav .cnt,.app .nav .lbl{display:none}
 .app .side .nav{padding:0;align-items:center;overflow:visible;flex:1 0 auto}
 .app .side .nav a{width:50px;height:52px;margin:0 auto;padding:0 1px;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-size:15px}
 .app .side .nav a svg{width:18px;height:18px}
 .app .side .nav .slbl{display:block;font-size:10px;line-height:12px;font-weight:500;letter-spacing:-.1px;text-align:center;white-space:nowrap;max-width:58px}
 .top{padding:8px 10px;gap:2px;row-gap:6px}
 .top h2{flex:1;max-width:none}
 .top .sp,.top .tag{display:none}
 .top .top-me{margin-left:4px;gap:2px}
 .top-av{width:32px;height:32px;font-size:12px}
 .icon-btn{width:36px;height:36px}
}
.content{flex:1;overflow:auto;padding:20px 22px 40px}
/* page header inside content */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.ph h1 span{color:inherit}
.content .ph h1{display:none}.content .ph.keep h1{display:block}
.content .ph:not(.keep) p{margin-top:0}
.ph p{margin:4px 0 0;color:var(--mut)}
/* buttons (primary = gradient, ghost = white bordered, as in the CRM apps) */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:var(--grad);color:#fff;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;line-height:1.3}
.btn:hover{filter:brightness(.95)}
.btn.ghost{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:#cfccc4;background:#fbfaf8;filter:none}
.btn.red{background:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled,.btn.dis{opacity:.5;cursor:not-allowed;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.sel{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--card)}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.kpi .v small,.kpi .v span{font-size:12px;color:var(--mut);font-weight:500}
.kpi .s{font-size:12px;color:var(--mut);margin-top:4px}
.kpi.alert{background:#fff8f7;border-color:#f2c9c4}.kpi.alert .v{color:var(--bad)}
.banner{display:flex;align-items:center;gap:12px;background:#fdf3de;border:1px solid #f0d08a;border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
.banner b{display:block}
.banner .sp{flex:1}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.cols.eq{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px;min-width:0}
.card h3{margin:0 0 2px;font-size:15px;font-weight:650}
.card .sub{color:var(--mut);font-size:12.5px;margin-bottom:12px}
table{width:100%;border-collapse:separate;border-spacing:0}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:1;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
td b{font-weight:600}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#faf9f6}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:auto;max-height:72vh}
.card table td,.card table th{padding-left:6px;padding-right:6px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--greyl);color:var(--mut);white-space:nowrap}
.tag.bad{background:var(--badl);color:var(--bad)}.tag.warn{background:var(--warnl);color:var(--warn)}.tag.ok{background:var(--okl);color:var(--ok)}.tag.blue{background:var(--pri-l);color:var(--pri)}.tag.mute{background:var(--greyl);color:var(--mut)}.tag.pur{background:var(--purl);color:var(--pur)}
.chip{display:inline-flex;font-size:11px;font-weight:600;background:var(--warnl);color:#9a6400;border-radius:20px;padding:1px 8px;margin:1px 3px 1px 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input,.filters select{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--card);outline:0}
.filters input:focus,.filters select:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.filters .count{margin-left:auto;color:var(--mut);font-size:13px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:550;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 3px rgba(20,20,30,.12)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:7px}
.icbtn{border:0;background:none;color:var(--mut);padding:5px 7px;border-radius:7px;cursor:pointer}
.icbtn:hover{background:var(--bg);color:var(--ink)}
.empty{padding:50px 20px;text-align:center;color:var(--mut)}
.chart{position:relative}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#141418;color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .1s}
.hbar{display:grid;grid-template-columns:130px 1fr 56px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.hbar .tr{background:var(--greyl);border-radius:6px;height:12px}
.hbar .fl{background:var(--pri);height:100%;border-radius:6px}
.hbar b{text-align:right;font-weight:650}
/* modal = CRM drawer-card style */
.mb{position:fixed;inset:0;background:rgba(20,20,24,.35);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:100;overflow:auto}
.md{background:var(--card);border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(20,20,24,.25);overflow:hidden}
.md.wide{max-width:980px}
.md .mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.md .mh h2{margin:0;font-size:17px}
.md .mc{padding:18px 20px;max-height:70vh;overflow:auto}
.md .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.fld{margin-bottom:14px}
.fld label,.lb{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 6px}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 11px;outline:none}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
textarea.inp{min-height:76px;resize:vertical}
.rte{min-height:110px;line-height:1.5}.rte b{font-weight:800}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.algrid{display:flex;flex-wrap:wrap;gap:6px}
.algrid label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 11px;font-size:12.5px;margin:0;cursor:pointer;color:var(--ink);font-weight:500}
.algrid label input{display:none}
.algrid label.on{background:var(--pri-l);border-color:var(--pri);color:var(--pri);font-weight:600}
.hint{color:var(--mut);font-size:12.5px;line-height:1.5}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:#141418;color:#fff;padding:11px 18px;border-radius:10px;opacity:0;transition:all .2s;z-index:200;pointer-events:none;font-weight:500}
.toast.on{opacity:1;transform:translateX(-50%)}
/* phones: messages stay at the bottom, clear of the header and its site dropdown */
@media (max-width:700px){.toast{top:auto;bottom:calc(16px + env(safe-area-inset-bottom));max-width:calc(100vw - 32px);width:max-content;text-align:center}}
.matrix td,.matrix th{text-align:center;padding:7px 5px}
.matrix td:first-child,.matrix th:first-child{text-align:left;padding-left:14px}
.matrix th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:118px;vertical-align:bottom}
.yes{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:800}
.mc-dot{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:2px dashed #aaa;color:#777;font-size:9px;font-weight:800}
.row{display:flex;gap:10px;align-items:center}
.tgl{width:42px;height:24px;border-radius:12px;background:#cfccc4;position:relative;border:0;flex:none;cursor:pointer}
.tgl:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tgl.on{background:var(--pri)}.tgl.on:after{left:21px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:16px}
.setrow:last-child{border:0}
.setrow b{display:block;font-weight:600}
pre{background:#141418;color:#d6dcf5;padding:14px;border-radius:10px;overflow:auto;font-size:12px;line-height:1.5;font-family:ui-monospace,Menlo,Consolas,monospace}
.lab{background:#fff;color:#000;font-family:"Arial Narrow",Arial,sans-serif;border:1px solid #ddd;box-shadow:0 4px 12px rgba(0,0,0,.12);padding:8px 10px 6px;width:290px;line-height:1.15}
.lab .ln{font-size:20px;font-weight:800;text-align:center;text-transform:uppercase}
.lab .ub{display:flex;justify-content:space-between;background:#000;color:#fff;padding:3px 6px;font-size:13px;font-weight:700;margin:3px -10px}
.lab .al{font-size:10.5px;font-weight:700;text-transform:uppercase}
.lab .ing{font-size:9.5px;margin:3px 0}.lab .ing b{font-weight:900;text-decoration:underline}
/* "All sites" overview for master */
.sitegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:16px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.sc:hover{border-color:var(--pri)}
.sc .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sc b{font-size:14.5px}
.sc .meta{font-size:12px;color:var(--mut)}
.sc .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.sc .nums div{font-size:11px;color:var(--mut);font-weight:600}
.sc .nums span{display:block;font-size:18px;color:var(--ink);font-weight:700;letter-spacing:-.02em}
.sc .go{margin-top:8px;color:var(--pri);font-weight:600;font-size:12.5px}

.auth2-fbrand .wordmark2{font-size:20px;letter-spacing:.14em;color:#17171c}
.auth2-fbrand .wordmark2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth2-form h1{font-size:26px;font-weight:750;letter-spacing:-.015em;margin:0}
.auth2-mut{color:#55555f;margin:0;font-size:15px}
.auth2-form label{font-size:13px;font-weight:600;margin-bottom:-6px}
.auth2-form .inp{height:46px;font-size:15px}
.auth2-form .go{height:46px;border:0;border-radius:10px;background:var(--grad);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.auth2-form .go:hover{filter:brightness(.95)}
.auth2-form .or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
.auth2-form .or:before,.auth2-form .or:after{content:"";flex:1;height:1px;background:var(--line)}
.auth2-form .ghost2{height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;cursor:pointer}
.auth2-form .ghost2:hover{background:#fbfaf8;border-color:#cfccc4}
.lg-err{background:var(--badl);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:14px}
.demo{margin-top:14px}
.demo .t{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 8px 2px}
.demo button{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;text-align:left;cursor:pointer}
.demo button:hover{border-color:var(--pri)}
.demo b{display:block;font-size:13.5px}.demo small{color:var(--mut);font-size:12px}
.art-cards{position:relative;height:300px;z-index:1}
.art-lab{position:absolute;background:#fff;color:#000;border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.45);font-family:Arial,sans-serif;padding:10px 12px;width:250px}
.art-lab .n{font-weight:800;font-size:20px;text-align:center;text-transform:uppercase}
.art-lab .u{display:flex;justify-content:space-between;background:#000;color:#fff;font-weight:700;font-size:13px;padding:3px 6px;margin:4px -12px}
.art-lab .a{font-size:10.5px;font-weight:700}
.art-pill{position:absolute;display:flex;align-items:center;gap:10px;background:#fff;color:#17171c;border-radius:14px;padding:10px 14px;box-shadow:0 18px 40px rgba(0,0,0,.4);font-size:13px}
.art-pill i{width:26px;height:26px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800}
.art-glow{position:absolute;right:-120px;top:20%;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(74,108,208,.45),transparent 65%)}

@media (max-width:1180px){.auth2-art h2{max-width:300px;font-size:32px}}
@media (max-width:700px){.content{padding:14px 12px 40px}}
@media (max-width:900px){.cols,.cols.eq{grid-template-columns:1fr}.auth2{grid-template-columns:1fr}.auth2-art{display:none}.g3{grid-template-columns:1fr 1fr}}

/* ===== Proview shell v4: exact Proview Signage values (SHELL_MATCH_SPEC.md, measured in headless Chrome) ===== */
body{font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.side{gap:0}
.side .nav{gap:0}
.side .nav>*{flex-shrink:0}
@media (hover:none) and (pointer:coarse){.top .hdr-pick select,.ov-search{font-size:16px!important}}
/* Locations page (master): page head and table exactly as Proview Signage's Locations page */
.content:has(>.ph.keep){max-width:1280px}   /* Signage's page area stops at 1280px */
.content .ph.keep{margin-bottom:22px}
.content .ph.keep h1{font-size:21px;font-weight:650;letter-spacing:-.01em;line-height:1.45}
.content .ph.keep p{font-size:15px;line-height:1.45;color:#55555f}
.content .ph.keep .btn{height:38px;padding:0 14px;font-size:14px;line-height:normal;box-sizing:border-box}
.content .ph.keep~.tbl th{font-size:12px;font-weight:600;line-height:1.45;letter-spacing:.04em;color:#8b8b95;padding:12px 16px;background:none}
.content .ph.keep~.tbl td{font-size:14px;line-height:1.45;padding:12px 16px}
/* header title: one line with an ellipsis, as Proview Signage (keeps its width from 701px up; the picker shrinks) */
html :is(#top,.top):is(#top,.top)>h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:auto}
@media (min-width:701px){html :is(#top,.top):is(#top,.top)>h2{flex-shrink:0}}
/* collapsed menu (desktop): same geometry as Proview Signage's collapsed menu */
@media (min-width:901px){
html .app.collapsed :is(.side,#pv-x){padding:18px 10px!important}
html .app.collapsed .side :is(.brand,#pv-x){justify-content:center!important;padding:4px 0 18px!important;gap:10px!important;margin:0!important}
html .app.collapsed .side :is(.nav,#pv-x){padding:6px 10px!important}
html .app.collapsed .side :is(.nav,#pv-x)>a,html .app.collapsed .side :is(.nav,#pv-x)>button:not(.nav-group):not(.nav-more){width:32px!important;min-width:0!important;margin:0 auto!important;padding:0 12px!important;gap:10px!important;justify-content:center!important}
html .app.collapsed .side :is(.side-foot,#pv-x){flex-direction:column!important;align-items:center!important;justify-content:normal!important;gap:4px!important;padding:0 10px 14px!important}
html .app.collapsed .side :is(.side-foot,#pv-x)>*{width:30px!important;height:26px!important;padding:6px 8px!important;margin:0!important;justify-content:center!important;box-sizing:border-box!important}
}
.cxrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cxrow .btn{width:42px;height:42px;justify-content:center;font-size:22px;padding:0}
.cxrow #cxn{width:70px;text-align:center;font-size:18px;font-weight:700}
.cxrow .cxu{font-size:16px;font-weight:600;margin-left:4px}

/* ---------- All locations (master): Proview Signage's Locations page (LOCATIONS_PAGE_STANDARD.md), same classes and values ---------- */
.ovp .ph.ov-head{margin-bottom:22px}
.ovp .btn{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:600 14px var(--font);line-height:normal;gap:7px;justify-content:center;box-sizing:border-box}
.ovp .btn:hover{border-color:#cfccc4;background:#fbfaf8;filter:none}
.ovp .btn svg{width:16px;height:16px}
.ovp .btn.primary{background:var(--grad);border-color:transparent;color:#fff}
.ovp .btn.primary:hover{background:var(--grad);border-color:transparent;filter:brightness(.95)}
.ovp .btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.ovp .tiny,.ov-li .tiny{font-size:12px;color:#8b8b95}
.ovp .muted,.ov-li .muted{color:#55555f}.ovp .small,.ov-li .small{font-size:13px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;line-height:1.45;padding:3px 9px;border-radius:999px;background:#eeece6;color:#55555f;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.badge.ok{background:#e5f6ec;color:var(--ok)}.badge.bad{background:#fdecea;color:var(--bad)}.badge.warn{background:#fff4dc;color:#a36a00}
.ov-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.ov-stat{padding:14px 16px;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.ov-stat:hover{border-color:#b9c6ea;transform:translateY(-1px)}
.ov-stat:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.ov-stat.ok .ov-v{color:var(--ok)}.ov-stat.warn .ov-v{color:var(--warn)}.ov-stat.bad .ov-v{color:var(--bad)}
.ov-v{font-size:26px;font-weight:700;margin-top:4px}
.ov-tools{display:flex;justify-content:flex-end;margin-bottom:12px}
.ov-search{height:40px;width:100%;max-width:100%;min-width:0;font:15px var(--font);line-height:normal;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;box-sizing:border-box}
.ov-search:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;align-items:start}
.ov-biz{display:flex;flex-direction:column;overflow:hidden;padding:0;margin:0}
.ov-bh{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px}.ov-bh h3{font-size:17px;font-weight:700;letter-spacing:-.015em;margin:0 0 2px}
.ov-loc{display:flex;align-items:center;gap:10px;width:100%;padding:11px 18px;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
button.ov-loc:hover,button.ov-li:hover{background:#f8f7f4}
.ov-bf{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-top:1px solid var(--line);margin-top:auto}
.ov-acts{display:flex;align-items:center;gap:8px;flex:none}
.ov-dot{width:9px;height:9px;border-radius:50%;flex:none;background:#c9c7c0}.ov-dot.ok{background:var(--ok)}.ov-dot.warn{background:var(--warn)}.ov-dot.bad{background:var(--bad)}
.ov-chev{color:var(--grey);font-size:20px;line-height:1}
.ov-list{display:flex;flex-direction:column;max-height:60vh;overflow-y:auto}
.ov-li{display:flex;align-items:center;gap:12px;width:100%;padding:11px 6px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.ov-li:last-child{border-bottom:0}
@media (max-width:700px){.ov-grid{grid-template-columns:1fr}.ov-search{width:100%}.ov-stats{grid-template-columns:repeat(3,1fr);gap:8px}.ov-stat{padding:10px 10px}.ov-stat .tiny{font-size:11px}.ov-v{font-size:21px}}
/* page title only in the top bar (as Proview Signage, 1906cd5): pages open with their summary tags or description and their buttons on one row */
.content .ph h1,.content .ph.keep h1{display:none}
.content .ph{align-items:center;gap:16px;margin-bottom:22px}
.content .ph p{margin:0;font-size:15px;line-height:1.45;color:#55555f}
.head-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.head-chips .chip{display:inline-flex;align-items:center;gap:6px;margin:0;padding:6px 12px;border-radius:999px;background:#efeee9;color:#44444d;font-size:13.5px;font-weight:600;line-height:1.45;white-space:nowrap}
.head-chips .chip.ok{background:#e6f6ec;color:#0b6b35}.head-chips .chip.warn{background:#fdf1dc;color:#7a4d00}
.chip-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
/* sign out: red button, white icon (as Proview Signage) */
.top-me .top-out{background:#d92d20;border-color:#d92d20;color:#fff}
.top-me .top-out:hover{background:#b42318;border-color:#b42318;color:#fff}
</style>
</head>

   *  Returns { allergens: [...], why: { Allergen: ['lasagne', 'wheat', …] } }. A suggestion only: always confirm against the recipe. */
  function suggestAllergens(name, description, ingredients) {
    const text = ' ' + [name, description, stripHtml(ingredients || '')].filter(Boolean).join(' ').toLowerCase().replace(/[^a-z0-9à-ÿ&'\- ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
    const why = {};
    const add = (a, w) => { (why[a] = why[a] || []); if (!why[a].includes(w)) why[a].push(w); };
    DISHES.forEach(([words, al]) => words.forEach((w) => { if (text.includes(' ' + w + ' ') || text.includes(' ' + w + 's ') || text.includes(' ' + w + 'es ')) al.forEach((a) => add(a, w)); }));
    ALLERGENS.forEach((a) => ALLERGEN_WORDS[a].forEach((w) => { if (new RegExp('(^|[^a-zà-ÿ])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=$|[^a-zà-ÿ])', 'i').test(text)) add(a, w); }));
    return { allergens: ALLERGENS.filter((a) => why[a]), why };
  }


  /** Bold every allergen word in plain/HTML ingredient text (existing <b> kept). */
  function boldAllergens(text) {
    const plain = stripHtml(text);
    const words = [];
    ALLERGENS.forEach((a) => ALLERGEN_WORDS[a].forEach((w) => words.push(w)));
    words.sort((a, b) => b.length - a.length);
    const re = new RegExp('(^|[^A-Za-zÀ-ÿ])(' + words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?=$|[^A-Za-zÀ-ÿ])', 'gi');
    // protect exceptions
    const masks = [];
    let masked = esc(plain);
    Object.entries(ALLERGEN_EXCEPTIONS).forEach(([ex, keep]) => {
      masked = masked.replace(new RegExp(ex, 'gi'), (m) => {
        const k = keep ? m.toLowerCase().indexOf(keep) : -1;
        masks.push(k >= 0 ? m.slice(0, k) + '<b>' + m.slice(k, k + keep.length) + '</b>' + m.slice(k + keep.length) : m);
        return '\u0000' + (masks.length - 1) + '\u0000';
      });
    });
    masked = masked.replace(re, (m, pre, w) => pre + '<b>' + w + '</b>');
    return masked.replace(/\u0000(\d+)\u0000/g, (m, i) => masks[+i]);
  }

  }

  // ---------- expiry ----------
  function computeExpiry(rule, from) {
    const d = from ? new Date(from) : new Date();
    if (!rule) return d;
    const u = Number(rule.units) || 0;
    if (rule.period === 'hours') d.setTime(d.getTime() + u * 3600e3);
    else if (rule.period === 'months') d.setMonth(d.getMonth() + u);
    else d.setDate(d.getDate() + u);
    return d;
  }
  function expiryStatus(label, at) {
    if (label.status && label.status !== 'active') return label.status;
    const t = (at ? new Date(at) : new Date()).getTime();
    const e = new Date(label.expiry).getTime();
    if (e < t) return 'expired';
    if (e - t < 24 * 3600e3) return 'today';
    return 'ok';
  }

  // ---------- store ----------

  // ---------- CSV ----------
  function toCSV(rows, cols) {
    const q = (v) => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    return [cols.map((c) => q(c.label || c.key)).join(',')].concat(rows.map((r) => cols.map((c) => q(typeof c.get === 'function' ? c.get(r) : r[c.key])).join(','))).join('\n');
  }
  function parseCSV(text) {
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    const head = (rows.shift() || []).map((h) => h.trim().toLowerCase());
    return rows.filter((r) => r.some((x) => x.trim())).map((r) => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
  }

  // ---------- Menu analyser (dashboard) ----------
  function analyseMenu(text) {
    const lines = String(text).split(/\n+/).map((l) => l.trim()).filter(Boolean);
    const out = [];
    for (const line of lines) {
      if (/^(starters?|mains?|main courses?|desserts?|puddings?|sides?|side orders?|drinks?|soft drinks|hot drinks|wines?|beers?|cocktails?|specials?|sharers?|sharing|small plates|large plates|kids|children'?s menu|sandwiches|salads?|burgers?|pizzas?|pasta|grill|sauces?|extras?|vegetarian|vegan|menu|breakfast|brunch|lunch|dinner)\b[:\s]*$/i.test(line)) continue;
      const m = line.match(/^(.*?)\s*[-–—:|]\s*(.+)$/);
      let name = m ? m[1] : line, desc = m ? m[2] : '';
      const priceM = (desc || name).match(/£?\s?(\d+(?:\.\d{1,2})?)\s*$/);
      let price = null;
      if (priceM) { price = parseFloat(priceM[1]); if (desc) desc = desc.slice(0, priceM.index).trim(); else name = name.slice(0, priceM.index).trim(); }
      name = name.replace(/[.·]+$/, '').trim();
      if (!name) continue;
      // no description and no price: probably a title or heading, so it starts unticked
      out.push({ name, description: desc, price, allergens: suggestAllergens(name, desc).allergens, inc: !(price == null && !desc) });
    }
    return out;
  }

  // ---------- Sync (Supabase REST / PostgREST, table pl_records) ----------
  // opts: { url, key, token }  token = the signed-in user's access token (row-level security decides

  // One business per request: changes are sent per business, each request naming it (x-pl-org header).
  // opts.scoped (the Proview master): pull only the All sites list (sites + devices of every business) and,
  // when a business is open (opts.org), that one business's data. Other businesses' data is dropped locally.
  const LIST_KINDS = ['sites', 'devices'];

  // The master's pull: the All sites list (sites + devices of every business) plus the open business, if any.
  async function pullScoped(s, base, headers, org, full) {
    const by = s.settings.sync.lastSyncBy = s.settings.sync.lastSyncBy || {};

        if (!res.ok) throw new Error('Couldn’t load from the server (' + res.status + ').');
        const rows = await res.json();

          const coll = s[row.kind]; if (!coll) return;
          const i = coll.findIndex((x) => x.id === row.id);

        });

        const seen = new Set();
        for (let off = 0; ; off += 1000) {
          const r3 = await fetch(base + '?select=id' + part.q + '&order=id.asc&limit=1000&offset=' + off, { headers: { ...headers, ...part.h } });
          if (!r3.ok) throw new Error('Couldn’t load from the server (' + r3.status + ').');

  async function sync(opts) {

/* Proview Label — cloud layer (shared by the back-office and the Android app).
 * Real accounts on the proview-label Supabase project + "Sign in with Proview account"
 * (dashboard.proviewcrm.co.uk hands over a signed, single-use token that sso-login swaps for a session).

(function (g) {
  'use strict';
  const C = g.PVL_CONFIG || {};
  const enabled = !!(C.SUPABASE_URL && C.SUPABASE_KEY && g.supabase && g.supabase.createClient);
  const PV_ACCOUNT = C.PV_ACCOUNT_URL || 'https://dashboard.proviewcrm.co.uk/';
  let sb = null;

    if (/email not confirmed/i.test(t)) return 'Confirm your email first: open the link we emailed you.';
    if (/already registered/i.test(t)) return 'There’s already an account for this email. Sign in instead.';
    if (/rate limit|too many/i.test(t)) return 'Too many attempts. Please wait a minute and try again.';
    if (/^TRIAL_USED: |^ALREADY_MEMBER: /.test(t)) return t.replace(/^[A-Z_]+: /, '');

.hub-pal{margin:12vh auto auto;width:min(580px,92vw);background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden;font-size:15px;color:#17171c}
.hub-pal .hp-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #eceae4;color:#8b8b95}
.hub-pal input{flex:1;border:0!important;outline:0;font:inherit;font-size:16px;padding:16px 0;background:none;color:#17171c;box-shadow:none!important}
.hub-pal .hp-list{max-height:min(420px,60vh);overflow:auto;padding:6px}
.hub-pal .hp-g{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8b8b95;padding:10px 10px 4px}
.hub-pal .hp-row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;cursor:pointer}
.hub-pal .hp-row.on{background:#f1f0ec}
.hub-pal .hp-row .hp-ic{width:30px;height:30px;border-radius:8px;background:#f3f2ee;display:grid;place-items:center;color:#4a4a55;flex:none}
.hub-pal .hp-row b{font-weight:600}.hub-pal .hp-row small{display:block;color:#8b8b95;font-size:13px}
.hub-pal .hp-empty{padding:22px;text-align:center;color:#8b8b95}
.hub-pal .hp-foot{border-top:1px solid #eceae4;padding:8px 14px;font-size:12px;color:#8b8b95}
.hub-panel{margin-left:auto;height:100%;width:min(760px,100vw);background:#fff;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.18);color:#17171c;font-size:15px}
.hub-panel.narrow{width:min(440px,100vw)}
.hub-ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #eceae4}
.hub-ph h3{margin:0;font-size:18px;font-weight:700;flex:1}
.hub-x{width:34px;height:34px;border-radius:9px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:#17171c}.hub-x:hover{background:#f3f2ee}
.hub-cbox{flex:1;display:grid;grid-template-columns:240px 1fr;min-height:0}
.hub-convs{border-right:1px solid #eceae4;overflow:auto;padding:8px}
.hub-conv{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}
.hub-conv:hover{background:#f6f5f1}.hub-conv.on{background:#eef1fb}
.hub-av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#2f84d4 0%,#5a5fbb 100%);color:#fff;font-weight:700;font-size:12.5px}
.hub-av.all{background:#17171c}
.hub-conv .ct{flex:1;min-width:0}.hub-conv b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub-conv small{display:block;font-size:12.5px;color:#8b8b95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub-conv .n{background:#d92d20;color:#fff;border-radius:9px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px}
.hub-thread{display:flex;flex-direction:column;min-height:0;min-width:0}
.hub-th{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #eceae4;font-weight:600}
.hub-th .hub-back{display:none}
.hub-msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#faf9f6}
.hub-msg{max-width:78%;align-self:flex-start}
.hub-msg .bub{background:#fff;border:1px solid #eceae4;border-radius:14px 14px 14px 4px;padding:8px 12px;white-space:pre-wrap;word-wrap:break-word}
.hub-msg.me{align-self:flex-end}.hub-msg.me .bub{background:linear-gradient(135deg,#2f84d4 0%,#5a5fbb 100%);color:#fff;border:0;border-radius:14px 14px 4px 14px}
.hub-msg .meta{font-size:11.5px;color:#8b8b95;margin:2px 6px}.hub-msg.me .meta{text-align:right}
.hub-day{align-self:center;font-size:12px;color:#8b8b95;padding:4px 0}
.hub-comp{display:flex;gap:8px;padding:10px;border-top:1px solid #eceae4;align-items:flex-end}
.hub-comp textarea{flex:1;resize:none;border:1px solid #e4e2dc;border-radius:10px;padding:9px 12px;font:inherit;font-size:15px;max-height:120px;outline:0;min-height:40px;box-sizing:border-box}
.hub-comp textarea:focus{border-color:#4a6cd0}
.hub-send{width:40px;height:40px;border-radius:10px;border:0;background:linear-gradient(135deg,#2f84d4 0%,#5a5fbb 100%);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.hub-note{margin:auto;max-width:340px;text-align:center;color:#6e6e78;padding:30px 20px;font-size:14px}
.hub-list{flex:1;overflow:auto}
.hub-item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid #f0efea;align-items:flex-start}
.hub-item.unread{background:#f6f8fe}
.hub-item .ii{width:34px;height:34px;border-radius:9px;background:#f3f2ee;display:grid;place-items:center;flex:none;color:#4a4a55}
.hub-item .it{flex:1;min-width:0}.hub-item b{font-weight:600}.hub-item .is{font-size:13px;color:#6e6e78;margin-top:2px}
.hub-item .ia{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.hub-item .ia button{height:32px;padding:0 12px;border-radius:8px;border:1px solid #e4e2dc;background:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:#17171c}
.hub-item .ia button.pri{background:linear-gradient(135deg,#2f84d4 0%,#5a5fbb 100%);color:#fff;border:0}
.hub-item .ia button.bad{color:#c62828}
.hub-item .tm{font-size:12px;color:#8b8b95;white-space:nowrap}
.hub-tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid #eceae4}
.hub-tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;font:inherit;font-size:13px;font-weight:600;color:#6e6e78;cursor:pointer}
.hub-tabs button.on{background:#f3f2ee;color:#17171c}
@media (max-width:700px){.hub-cbox{grid-template-columns:1fr}.hub-cbox.open .hub-convs{display:none}.hub-cbox:not(.open) .hub-thread{display:none}.hub-th .hub-back{display:grid}.hub-pal{margin-top:8vh}}
`;
  const style = document.createElement('style'); style.textContent = css; document.head.appendChild(style);

  let A = null;               // the app adapter
  const badges = { chat: new Set(), inbox: new Set() };
  const lastKey = (k) => 'pvhub.' + (A && A.key ? A.key() : 'x') + '.' + k;

  function close() { document.querySelectorAll('.hub-bg').forEach((e) => e.remove()); document.removeEventListener('keydown', onEsc, true); }
  function onEsc(e) { if (e.key === 'Escape') { e.stopPropagation(); close(); } }
  function overlay(inner, onBg) {
    close();
    const bg = document.createElement('div'); bg.className = 'hub-bg';
    bg.innerHTML = inner;
    bg.addEventListener('mousedown', (e) => { if (e.target === bg) (onBg || close)(); });
    document.body.appendChild(bg);
    document.addEventListener('keydown', onEsc, true);
    return bg;
  }

  /* ---------------- header tray ---------------- */
  function badge(kind) { const b = document.createElement('span'); b.className = 'hub-badge hidden'; badges[kind].add(b); setTimeout(paint, 0); return b; }
  function btn(kind, title, onClick) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'hub-' + kind; b.title = title; b.setAttribute('aria-label', title);
    b.innerHTML = svg(kind === 'inbox' ? 'mail' : kind);
    b.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); onClick(); });
    if (kind === 'chat' || kind === 'inbox') b.appendChild(badge(kind));
    return b;
  }
  /** "Dashboard" link back to dashboard.proviewcrm.co.uk (owners, admins and managers only: pass show=false for others). */
  function dashLink(show) {
    if (!show) return null;
    const a = document.createElement('a');
    a.className = 'pv-dash'; a.href = 'https://dashboard.proviewcrm.co.uk/';
    a.title = 'Proview dashboard: all your Proview apps'; a.setAttribute('aria-label', 'Proview dashboard');
    a.innerHTML = svg('grid') + '<span>Dashboard</span>';
    return a;
  }
  /** Build the tray: [status dot, search, chat, inbox, bell]. bellEl is the app's own bell button. */
  function tray({ dot, bell }) {
    const cap = document.createElement('div'); cap.className = 'hdr-cap';
    if (!dot) { dot = document.createElement('span'); dot.className = 'hdr-dot'; dot.title = 'Online'; dot.setAttribute('role', 'img'); dot.setAttribute('aria-label', 'Online'); }
    dot.classList.add('hdr-dot');
    cap.appendChild(dot);
    cap.appendChild(btn('search', 'Search (Ctrl+K)', openSearch));
    cap.appendChild(btn('chat', 'Team chat', openChat));
    cap.appendChild(btn('inbox', 'Inbox', openInbox));
    if (bell) { bell.classList.remove('btn', 'ghost', 'icon', 'icon-btn'); const old = bell.querySelector('svg'); if (old) old.outerHTML = svg('bell'); cap.appendChild(bell); }
    return cap;
  }
  function paint() {
    if (!A) return;
    const set = (kind, n) => badges[kind].forEach((b) => { if (!b.isConnected) { if (b._live) badges[kind].delete(b); return; } b._live = true; b.textContent = n > 9 ? '9+' : n ? String(n) : ''; b.classList.toggle('hidden', !n); });
    try { set('chat', chatUnread()); } catch (e) {}
    try { set('inbox', A.inbox ? A.inbox.count() : 0); } catch (e) {}
  }

  /* ---------------- search ---------------- */
  function openSearch() {
    const bg = overlay(`<div class="hub-pal" role="dialog" aria-label="Search"><div class="hp-in">${svg('search', 18)}<input placeholder="Search pages and people" aria-label="Search"></div><div class="hp-list"></div><div class="hp-foot">↑ ↓ to move · Enter to open · Esc to close</div></div>`);
    const inp = bg.querySelector('input'), list = bg.querySelector('.hp-list');
    let rows = [], on = 0;
    const draw = () => {
      const q = inp.value.trim().toLowerCase();
      rows = (A.searchItems ? A.searchItems(q) : []).slice(0, 40);
      on = 0;
      if (!rows.length) { list.innerHTML = `<div class="hp-empty">${q ? 'Nothing matches “' + esc(inp.value) + '”' : 'Start typing to search'}</div>`; return; }
      let g = '', html = '';
      rows.forEach((r, i) => {
        if (r.group !== g) { g = r.group; html += `<div class="hp-g">${esc(g)}</div>`; }
        html += `<div class="hp-row${i === 0 ? ' on' : ''}" data-i="${i}"><span class="hp-ic">${r.av ? `<span class="hub-av" style="width:30px;height:30px;font-size:11px">${esc(initials(r.label))}</span>` : svg(r.icon || 'page', 16)}</span><span><b>${esc(r.label)}</b>${r.hint ? `<small>${esc(r.hint)}</small>` : ''}</span></div>`;
      });
      list.innerHTML = html;
    };
    const pick = (i) => { const r = rows[i]; if (!r) return; close(); setTimeout(() => r.run(), 0); };
    const move = (d) => { const els = list.querySelectorAll('.hp-row'); if (!els.length) return; els[on]?.classList.remove('on'); on = (on + d + els.length) % els.length; els[on].classList.add('on'); els[on].scrollIntoView({ block: 'nearest' }); };
    inp.addEventListener('input', draw);
    inp.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown') { e.preventDefault(); move(1); } else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); } else if (e.key === 'Enter') { e.preventDefault(); pick(on); } });
    list.addEventListener('click', (e) => { const r = e.target.closest('.hp-row'); if (r) pick(+r.dataset.i); });
    draw(); setTimeout(() => inp.focus(), 0);
  }
  document.addEventListener('keydown', (e) => {
    if (!A) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); }
  });

  /* ---------------- chat ---------------- */
  // conversation ids: 'all' (everyone) or a person id (direct message)
  const readAt = (conv) => (ls.get(lastKey('read')) || {})[conv] || 0;
  const markRead = (conv) => { const r = ls.get(lastKey('read')) || {}; r[conv] = Date.now(); ls.set(lastKey('read'), r); paint(); };
  const convOf = (m, me) => (m.to && m.to !== 'all' ? (m.by === me ? m.to : m.by) : 'all');
  function chatUnread() {
    if (!A || !A.chat) return 0;
    const me = A.chat.me().id, msgs = A.chat.cached() || [];
    return msgs.filter((m) => m.by !== me && new Date(m.at).getTime() > readAt(convOf(m, me))).length;
  }
  let chatState = null;
  async function openChat(conv) {
    if (!A || !A.chat) return;
    const bg = overlay(`<div class="hub-panel" role="dialog" aria-label="Team chat"><div class="hub-ph"><h3>Team chat</h3><button class="hub-x" aria-label="Close">${svg('x')}</button></div><div class="hub-cbox"><div class="hub-convs"></div><div class="hub-thread"><div class="hub-th"><button class="hub-x hub-back" aria-label="Back">${svg('left')}</button><span class="tt"></span></div><div class="hub-msgs"></div><div class="hub-comp"><textarea rows="1" placeholder="Write a message"></textarea><button class="hub-send" aria-label="Send">${svg('send', 18)}</button></div></div></div></div>`);
    bg.querySelector('.hub-ph .hub-x').onclick = close;
    const S = chatState = { bg, conv: conv || 'all', open: !!conv };
    const box = bg.querySelector('.hub-cbox'), convs = bg.querySelector('.hub-convs'), msgsEl = bg.querySelector('.hub-msgs'), ta = bg.querySelector('textarea');
    bg.querySelector('.hub-back').onclick = () => { S.open = false; box.classList.remove('open'); drawConvs(); };
    const err = A.chat.unavailable && A.chat.unavailable();
    if (err) { box.outerHTML = `<div class="hub-note">${esc(err)}</div>`; return; }
    const drawConvs = () => {
      const me = A.chat.me().id, msgs = A.chat.cached() || [];
      const last = {}; const unread = {};
      msgs.forEach((m) => { const c = convOf(m, me); if (!last[c] || m.at > last[c].at) last[c] = m; if (m.by !== me && new Date(m.at).getTime() > readAt(c)) unread[c] = (unread[c] || 0) + 1; });
      const people = A.chat.people().filter((p) => p.id !== me);
      people.sort((a, b) => (last[b.id] ? new Date(last[b.id].at) : 0) - (last[a.id] ? new Date(last[a.id].at) : 0) || a.name.localeCompare(b.name));
      const row = (id, name, sub, all) => `<div class="hub-conv${S.conv === id ? ' on' : ''}" data-c="${esc(id)}"><span class="hub-av${all ? ' all' : ''}">${all ? svg('users', 16) : esc(initials(name))}</span><span class="ct"><b>${esc(name)}</b><small>${esc(last[id] ? (last[id].by === me ? 'You: ' : '') + last[id].text : sub || '')}</small></span>${unread[id] ? `<span class="n">${unread[id]}</span>` : ''}</div>`;
      convs.innerHTML = row('all', A.chat.teamName ? A.chat.teamName() : 'Everyone', 'Whole team', true) + people.map((p) => row(p.id, p.name, p.sub)).join('');
    };
    const drawMsgs = () => {
      const me = A.chat.me().id;
      const list = (A.chat.cached() || []).filter((m) => convOf(m, me) === S.conv).sort((a, b) => new Date(a.at) - new Date(b.at));
      const who = (id) => (A.chat.people().find((p) => p.id === id) || {}).name || 'Someone';
      bg.querySelector('.tt').textContent = S.conv === 'all' ? (A.chat.teamName ? A.chat.teamName() : 'Everyone') : who(S.conv);
      if (!list.length) { msgsEl.innerHTML = `<div class="hub-note">${S.conv === 'all' ? 'Say hello to the team. Everyone in the business can read messages here.' : 'Only you and ' + esc(who(S.conv)) + ' can see this conversation.'}</div>`; return; }
      let day = '', html = '';
      list.forEach((m) => {
        const d = new Date(m.at).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
        if (d !== day) { day = d; html += `<div class="hub-day">${esc(d)}</div>`; }
        const mine = m.by === me;
        html += `<div class="hub-msg${mine ? ' me' : ''}"><div class="bub">${esc(m.text)}</div><div class="meta">${mine ? '' : esc(m.byName || who(m.by)) + ' · '}${hm(m.at)}</div></div>`;
      });
      msgsEl.innerHTML = html; msgsEl.scrollTop = msgsEl.scrollHeight;
    };
    S.redraw = () => { drawConvs(); drawMsgs(); if (S.open || window.innerWidth > 700) markRead(S.conv); };
    convs.addEventListener('click', (e) => { const c = e.target.closest('.hub-conv'); if (!c) return; S.conv = c.dataset.c; S.open = true; box.classList.add('open'); S.redraw(); ta.focus(); });
    const send = async () => {
      const t = ta.value.trim(); if (!t) return;
      ta.value = ''; ta.style.height = '';
      try { await A.chat.send(S.conv, t); } catch (e) { ta.value = t; alert(e.message || 'Couldn’t send that message'); }
      S.redraw();
    };
    bg.querySelector('.hub-send').onclick = send;
    ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
    ta.addEventListener('input', () => { ta.style.height = ''; ta.style.height = Math.min(120, ta.scrollHeight) + 'px'; });
    if (S.open) box.classList.add('open');
    S.redraw();
    try { if (A.chat.refresh) { await A.chat.refresh(); if (chatState === S && S.bg.isConnected) S.redraw(); } } catch (e) {}
  }
  /** apps call this when messages arrive */
  function chatChanged() { paint(); if (chatState && chatState.bg.isConnected) chatState.redraw(); }

  /* ---------------- inbox ---------------- */
  let inboxBg = null;
  async function openInbox() {
    if (!A || !A.inbox) return;
    const bg = inboxBg = overlay(`<div class="hub-panel narrow" role="dialog" aria-label="Inbox"><div class="hub-ph"><h3>Inbox</h3><button class="hub-x" aria-label="Close">${svg('x')}</button></div><div class="hub-list"><div class="hub-note">Loading…</div></div></div>`);
    bg.querySelector('.hub-x').onclick = close;
    const draw = async () => {
      let items = [];
      try { items = await A.inbox.items(); } catch (e) { bg.querySelector('.hub-list').innerHTML = `<div class="hub-note">${esc(e.message || 'Couldn’t load your inbox')}</div>`; return; }
      const list = bg.querySelector('.hub-list');
      if (!items.length) { list.innerHTML = `<div class="hub-note">${esc(A.inbox.empty || 'You’re all caught up.')}</div>`; return; }
      list.innerHTML = items.map((it, i) => `<div class="hub-item${it.unread ? ' unread' : ''}" data-i="${i}"><span class="ii">${svg(it.icon || 'mail', 17)}</span><div class="it"><b>${esc(it.title)}</b>${it.sub ? `<div class="is">${esc(it.sub)}</div>` : ''}${it.actions && it.actions.length ? `<div class="ia">${it.actions.map((a, j) => `<button data-a="${j}" class="${a.kind || ''}">${esc(a.label)}</button>`).join('')}</div>` : ''}</div>${it.at ? `<span class="tm">${ago(it.at)}</span>` : ''}</div>`).join('');
      list.onclick = async (e) => {
        const row = e.target.closest('.hub-item'); if (!row) return;
        const it = items[+row.dataset.i]; const b = e.target.closest('button[data-a]');
        if (b) { b.disabled = true; try { await it.actions[+b.dataset.a].run(); } catch (er) { alert(er.message || 'That didn’t work'); } paint(); if (bg.isConnected) draw(); return; }
        if (it.open) { close(); it.open(); }
      };
      if (A.inbox.seen) { A.inbox.seen(); paint(); }
    };
    draw();
  }

  /* ---------------- account menu (the avatar in the header) ---------------- */
  // PVHub.accountMenu(avatarButton, { name, email, sub, items: [{ label, icon, href | run, sep }] })
  // Opens under the avatar, right-aligned to it. Click the avatar again, click outside, press Esc,
  // pick an item or change page to close. Up/Down move between items.
  let acct = null;
  function closeAccount() { if (!acct) return; acct.el.remove(); acct.btn.setAttribute('aria-expanded', 'false'); document.removeEventListener('mousedown', acct.out, true); document.removeEventListener('keydown', acct.key, true); removeEventListener('hashchange', closeAccount); acct = null; }
  function accountMenu(btn, o) {
    if (acct) { const was = acct.btn; closeAccount(); if (was === btn) return; }
    const m = document.createElement('div'); m.className = 'pv-acct'; m.setAttribute('role', 'menu'); m.setAttribute('aria-label', 'My account');
    m.innerHTML = `<div class="pv-acct-h"><span class="hub-av">${esc(o.initials || initials(o.name || o.email))}</span><span class="ct"><b>${esc(o.name || '')}</b>${o.email ? `<small>${esc(o.email)}</small>` : ''}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</span></div>`;
    (o.items || []).forEach((it) => {
      if (it.sep) { const d = document.createElement('div'); d.className = 'pv-acct-sep'; m.appendChild(d); }
      const el = document.createElement(it.href ? 'a' : 'button'); el.className = 'pv-acct-i'; el.setAttribute('role', 'menuitem');
      if (it.href) { el.href = it.href; if (/^https?:/.test(it.href)) { el.target = '_self'; } } else el.type = 'button';
      el.innerHTML = svg(it.icon || 'page', 17) + `<span>${esc(it.label)}</span>`;
      el.addEventListener('click', (e) => { closeAccount(); if (it.run) { e.preventDefault(); it.run(); } });
      m.appendChild(el);
    });
    document.body.appendChild(m);
    const r = btn.getBoundingClientRect();
    m.style.top = Math.round(r.bottom + 8) + 'px';
    m.style.right = Math.max(8, Math.round(innerWidth - r.right)) + 'px';
    const items = () => [...m.querySelectorAll('.pv-acct-i')];
    acct = { el: m, btn,
      out: (e) => { if (!m.contains(e.target) && !btn.contains(e.target)) closeAccount(); },
      key: (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); closeAccount(); btn.focus(); return; }
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const l = items(), i = l.indexOf(document.activeElement); l[(i + (e.key === 'ArrowDown' ? 1 : -1) + l.length) % l.length]?.focus(); }
      } };
    btn.setAttribute('aria-expanded', 'true');
    document.addEventListener('mousedown', acct.out, true); document.addEventListener('keydown', acct.key, true);
    addEventListener('hashchange', closeAccount);
    if (o.focusFirst) items()[0]?.focus();
  }

  window.PVHub = {
    init(adapter) { A = adapter; paint(); },
    adapter: () => A,
    tray, dashLink, accountMenu, closeAccount, paint, chatChanged, openSearch, openChat, openInbox, close, svg, initials,
  };
})();

</script>
<script>

  const err=(m,kind)=>{ LOGIN.msg=m; LOGIN.kind=kind||'bad'; const el=$('#lerr'); if(el) el.innerHTML=m?`<div class="lg-err" style="${kind==='ok'?'background:#e7f6ed;color:#12a150':''}" role="alert">${esc(m)}</div>`:''; };
  const mode=LOGIN.mode, up=mode==='signup', reset=mode==='reset', newpw=mode==='newpw';
  const accts=CLOUD?[]:P.live('users').filter(u=>u.email&&u.password);
  const title=newpw?'Choose a new password':reset?'Reset your password':up?'Create your login':'Sign in';
  const sub=newpw?'At least 8 characters.':reset?'We’ll email you a link to choose a new password.':up?'Use the email your business owner or Proview added for you. New to Proview Label? Create a login to start a free 3-day trial.':'Manage products, allergens, expiry and wastage across your locations.';
  $('#app').innerHTML=`<div class="auth2">${loginArt()}
    <div class="auth2-form"><div>
      <form id="lf" autocomplete="on" novalidate>
        <div class="auth2-fbrand"><div class="auth2-logo"></div><div class="wordmark2">PROVIEW<span>LABEL</span></div></div>
        <h1>${title}</h1><p class="auth2-mut">${sub}</p>
        <div id="lerr"></div>
        ${newpw?'':`<label for="le">Email</label><input class="inp" id="le" type="email" placeholder="you@company.com" autocomplete="username">`}
        ${reset?'':`<label for="lp">${newpw?'New password':'Password'}</label><input class="inp" id="lp" type="password" placeholder="Password" autocomplete="${up||newpw?'new-password':'current-password'}">`}
        ${up||newpw?`<label for="lp2">Confirm password</label><input class="inp" id="lp2" type="password" autocomplete="new-password">`:''}
        <button class="go" type="submit" id="lgo">${newpw?'Save password':reset?'Send reset link':up?'Create login':'Sign in'}</button>
        ${mode==='signin'?`<div class="or">or</div><button class="ghost2" type="button" id="sso">Sign in with Proview account</button>`:''}
        ${CLOUD?`<div class="row" style="justify-content:space-between;font-size:13.5px">${mode==='signin'?`<a href="#" data-m="signup">Create a login</a><a href="#" data-m="reset">Forgot password?</a>`:newpw?'':`<a href="#" data-m="signin">Back to sign in</a>`}</div>`:''}
      </form>
      ${accts.length?`<div class="demo"><div class="t">Demo accounts (password shown)</div>
        ${accts.map(u=>`<button data-u="${u.id}"><span class="av ${u.role==='master'?'master':''}">${esc(P.initials(u.name))}</span><span style="flex:1"><b>${esc(u.name)} <span class="tag ${u.role==='master'?'pur':u.role==='admin'?'blue':'mute'}">${P.ROLES[u.role]}</span></b><small>${esc(u.email)} · ${esc(u.password)} · ${u.role==='master'?'every business':(u.role==='admin'?orgName(u.orgId)+' (all locations)':(u.siteIds||[]).map(siteName).map(esc).join(', '))}</small></span></button>`).join('')}</div>`:''}
    </div></div></div>`;
  if(LOGIN.msg) err(LOGIN.msg,LOGIN.kind);
  $('#app').querySelectorAll('[data-m]').forEach(a=>a.onclick=(e)=>{ e.preventDefault(); LOGIN={msg:'',kind:'bad',mode:a.dataset.m}; renderLogin(); });
  const sso=$('#sso'); if(sso) sso.onclick=()=>{ if(!CLOUD) return err('“Sign in with Proview account” works in the hosted back-office (label.proviewcrm.co.uk). Use a demo account below here.'); location.href=Cloud.proviewAccountUrl(HERE); };
  $('#lf').onsubmit=async(e)=>{ e.preventDefault();
    const em=($('#le')||{}).value?$('#le').value.trim().toLowerCase():'', pw=($('#lp')||{}).value||'';
    if(!CLOUD){ const u=accts.find(x=>x.email.toLowerCase()===em); if(!u||u.password!==pw) return err('That email and password don’t match an account.'); return signIn(u); }
    const go=$('#lgo'); go.disabled=true;
    try{
      if(newpw){ if(pw.length<8) throw new Error('Use at least 8 characters.'); if(pw!==$('#lp2').value) throw new Error('The two passwords don’t match.'); await Cloud.setPassword(pw); LOGIN={msg:'',kind:'ok',mode:'signin'}; return boot(true); }
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) throw new Error('Enter your email address.');
      if(reset){ await Cloud.resetPassword(em,HERE); LOGIN={msg:'If there’s a login for that email, a reset link is on its way.',kind:'ok',mode:'signin'}; return renderLogin(); }
      if(up){ if(pw.length<8) throw new Error('Use at least 8 characters for your password.'); if(pw!==$('#lp2').value) throw new Error('The two passwords don’t match.');
        const d=await Cloud.signUp(em,pw,HERE); if(!d.session){ LOGIN={msg:`Check your inbox: we’ve sent a confirmation link to ${em}.`,kind:'ok',mode:'signin'}; return renderLogin(); } return boot(true); }
      if(!pw) throw new Error('Enter your password.');
      await Cloud.signIn(em,pw); LOGIN={msg:'',kind:'bad',mode:'signin'}; await boot(true);
    }catch(ex){ go.disabled=false; err(Cloud.friendly?Cloud.friendly(ex):ex.message); }
  };
  $('#app').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{ const u=P.byId('users',b.dataset.u); signIn(u); });
}
async function ssoArrive(){ splash(); try{ if(await Cloud.consumeSsoHash()){ LOGIN={msg:'',kind:'bad',mode:'signin'}; return boot(true); } }catch(e){ WHO=null; LOGIN={msg:e.message,kind:'bad',mode:'signin'}; render(); } }
window.addEventListener('hashchange',()=>{ if(/pv_sso=/.test(location.hash)){ if(CLOUD) ssoArrive(); return; } takePairHash(); render(); const m=$('#main'); if(m) m.scrollTop=0; });

// ---------- modal helpers ----------
function modal(title, body, foot, wide){
  $('#modal').innerHTML=`<div class="mb"><div class="md ${wide?'wide':''}"><div class="mh"><h2>${esc(title)}</h2><button class="icbtn" data-x style="font-size:22px">×</button></div><div class="mc">${body}</div>${foot!==false?`<div class="mf">${foot||'<button class="btn ghost" data-x>Close</button>'}</div>`:''}</div></div>`;
  $('#modal').querySelectorAll('[data-x]').forEach(b=>b.onclick=closeModal);
  $('#modal .mb').onclick=e=>{ if(e.target.classList.contains('mb')) closeModal(); };
  return $('#modal .md');
}
function closeModal(){ $('#modal').innerHTML=''; }
function confirmM(title,text,ok,cb){ const m=modal(title,`<p>${esc(text)}</p>`,`<button class="btn ghost" data-x>Cancel</button><button class="btn red" id="cok">${esc(ok)}</button>`); m.querySelector('#cok').onclick=()=>{closeModal();cb();}; }
function exportCSV(name, rows, cols){
  const csv=P.toCSV(rows,cols);
  const m=modal('Export '+name, `<p class="hint">${rows.length} rows. Download the CSV, or copy it into Excel / Google Sheets.</p><textarea class="inp" style="min-height:220px;font-family:monospace;font-size:11.5px" readonly>${esc(csv)}</textarea>`, `<button class="btn ghost" id="dl">Download .csv</button><button class="btn" id="cp">Copy</button>`);
  m.querySelector('#cp').onclick=()=>{ const t=m.querySelector('textarea'); t.select(); (navigator.clipboard?navigator.clipboard.writeText(csv):Promise.reject()).then(()=>toast('Copied')).catch(()=>{try{document.execCommand('copy');toast('Copied');}catch(e){toast('Select the text and copy');}}); };
  m.querySelector('#dl').onclick=()=>{ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=name.toLowerCase().replace(/\s+/g,'-')+'-'+P.fmtDate(new Date()).replace(/\//g,'-')+'.csv'; document.body.appendChild(a); a.click(); a.remove(); }catch(e){} toast('If nothing downloaded, use Copy (downloads are blocked in previews)'); };
}
function audit(action,entity,detail,orgId){ P.audit(me().name,action,entity,detail,orgId===undefined?curOrg():orgId); }

// ---------- chart: single-series bars with hover ----------
function barChart(el, data, opts){
  const W=640,H=220,pl=34,pb=26,pt=12,pr=6; const max=Math.max(1,...data.map(d=>d.v)); const nice=Math.ceil(max/5)*5||5;
  const bw=(W-pl-pr)/data.length; const y=v=>pt+(H-pt-pb)*(1-v/nice);
  const ticks=[0,nice/2,nice];
  el.innerHTML=`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="#EEF1F4"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="10.5" fill="#69727D">${t}</text>`).join('')}
    ${data.map((d,i)=>{ const x=pl+i*bw+bw*0.18, w=bw*0.64, h=Math.max(0,(H-pt-pb)-(y(d.v)-pt)); return `<g class="b" data-i="${i}"><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent"/><path d="M${x},${H-pb} V${y(d.v)+Math.min(4,h)} q0,-4 4,-4 h${w-8} q4,0 4,4 V${H-pb} Z" fill="${d.hi?'#3a59b8':'#4a6cd0'}" opacity="${d.v?1:.25}"/></g>${(i%2===data.length%2||data.length<10)?`<text x="${pl+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#69727D">${esc(d.k)}</text>`:''}`; }).join('')}
    <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="#CFD5DB"/></svg><div class="tip"></div></div>`;
  const tip=el.querySelector('.tip'), svg=el.querySelector('svg');
  el.querySelectorAll('g.b').forEach(g=>{ g.onmouseenter=()=>{ const d=data[+g.dataset.i]; tip.innerHTML=`<b>${esc(d.full||d.k)}</b><br>${d.v} ${esc(opts.unit)}`; const r=svg.getBoundingClientRect(); const sc=r.width/W; tip.style.left=((pl+(+g.dataset.i+.5)*bw)*sc)+'px'; tip.style.top=(y(d.v)*sc)+'px'; tip.style.opacity=1; g.querySelector('path').setAttribute('fill','#3a59b8'); };
    g.onmouseleave=()=>{ tip.style.opacity=0; g.querySelector('path').setAttribute('fill',data[+g.dataset.i].hi?'#3a59b8':'#4a6cd0'); }; });
}
function hbars(rows, fmt){ const max=Math.max(1,...rows.map(r=>r.v)); return rows.map(r=>`<div class="hbar" title="${esc(r.k)}: ${fmt?fmt(r.v):r.v}"><span>${esc(r.k)}</span><div class="tr"><div class="fl" style="width:${(r.v/max*100).toFixed(1)}%"></div></div><b>${fmt?fmt(r.v):r.v}</b></div>`).join('')||'<div class="empty">No data</div>'; }

function importProductsCSV(text,orgId){

let analysed=null;
// ---------- PDF menus: pdf.js is loaded only when someone uploads a PDF ----------
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsP=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return pdfjsP||(pdfjsP=new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=PDFJS+'pdf.min.js';
    sc.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; res(window.pdfjsLib); };
    sc.onerror=()=>{ pdfjsP=null; rej(new Error('Could not load the PDF reader – check your internet connection')); }; document.head.appendChild(sc); }));
}
// text of every page, rebuilt into lines (items on the same baseline joined left to right)
let setPdfMsg=null;
async function pdfMenuText(file){
  const lib=await loadPdfJs(); const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise; const out=[];
  for(let n=1;n<=doc.numPages;n++){ if(n%5===0) setPdfMsg&&setPdfMsg(`Reading page ${n} of ${doc.numPages}…`);
    const pg=await doc.getPage(n); const tc=await pg.getTextContent(); const rows=[];
    tc.items.forEach(it=>{ if(!it.str||!it.str.trim()) return; const y=it.transform[5], x=it.transform[4], h=Math.abs(it.transform[3])||10;
      let r=rows.find(r=>Math.abs(r.y-y)<h*0.45); if(!r){ r={y,parts:[]}; rows.push(r); } r.parts.push({x,s:it.str,w:it.width||0}); });
    rows.sort((a,b)=>b.y-a.y).forEach(r=>{ r.parts.sort((a,b)=>a.x-b.x); let line='', end=null;
      r.parts.forEach(p=>{ const gap=end==null?0:p.x-end; line+=(line&&gap>2&&!/\s$/.test(line)&&!/^\s/.test(p.s)?(gap>40?'  ':' '):'')+p.s; end=p.x+p.w; });
      line=line.replace(/\s+/g,' ').trim(); if(line) out.push(line); });
    out.push('');
  }
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

    <div style="margin-top:14px;display:flex;justify-content:flex-end"><button class="btn" id="imp">Import selected</button></div></div>`;

    r.querySelectorAll('[data-nm]').forEach(c=>c.oninput=()=>analysed.items[c.dataset.nm].name=c.value);

      analysed.items.filter(it=>it.inc!==false&&it.name.trim()).forEach(it=>{ P.upsert('products',{id:P.uid('p_'),orgId,categoryId:cid,name:it.name.trim(),allergens:it.allergens.slice(),mayContain:'',customAllergens:'',ingredients:sale&&it.description?P.boldAllergens(it.description):'',price:it.price,barcode:'',ruleId:null,dateType:'use-by',prepGuide:'',timesPrinted:0,approved:!orgSettings(orgId).requireApproval}); n++; });
      audit('imported','Products','Menu analyser: '+n+' dishes',orgId); analysed=null; toast(n+' dishes imported'); location.hash='products'; };
      if(sel==='__new') withOrg(o=>go(P.upsert('categories',{id:P.uid('c_'),orgId:o,name:'Menu',type:'sale',color:'#00897B'}).id)); else go(sel); };
  };
  el.querySelector('#go').onclick=()=>{ const t=el.querySelector('#mt').value; analysed={text:t,items:P.analyseMenu(t)}; draw(); };
  el.querySelector('#pdfIn').onchange=async e=>{
    const f=e.target.files[0]; e.target.value=''; if(!f) return;
    const lbl=el.querySelector('#pdfLbl'), msg=el.querySelector('#pdfMsg');
    lbl.classList.add('dis'); msg.textContent='Reading '+f.name+'…'; setPdfMsg=(t)=>{ msg.textContent=t; };
    try{
      const text=/\.txt$/i.test(f.name)||f.type==='text/plain' ? await f.text() : await pdfMenuText(f);
      if(!text.trim()) throw new Error('No text found in this PDF. It may be a scanned picture of a menu – type or paste the dishes instead.');
      el.querySelector('#mt').value=text; analysed={text,items:P.analyseMenu(text)}; draw();
      msg.textContent='From '+f.name+' · check the text, edit if needed, then press Analyse again';

  };
  draw();
};

  // Proview Signage's Locations page (LOCATIONS_PAGE_STANDARD.md): description and buttons, clickable summary boxes,
