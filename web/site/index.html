  const byN=(a,b)=>String(a.name).localeCompare(String(b.name));
  const orgs=visibleOrgs().slice().sort(byN);
  const sitesOf=(o)=>P.live('sites').filter(x=>x.orgId===o.id).sort(byN);
  const allSites=orgs.flatMap(o=>sitesOf(o).map(x=>({o,s:x})));
  const devsAt=(ids)=>P.live('devices').filter(d=>ids.includes(d.siteId));
  const devs=devsAt(allSites.map(r=>r.s.id));
  // online = synced in the last 6 hours: the same threshold as Label's device status (siteStats().online)
  const isOn=(d)=>!!d.lastSync&&Date.now()-new Date(d.lastSync)<6*3600e3;
  const online=devs.filter(isOn), offline=devs.filter(d=>!isOn(d));
  const needs=orgs.filter(o=>orgState(o)!=='active');
  const trialOk=!CLOUD||(WHO&&Cloud.trialReady&&Cloud.trialReady(WHO));
  const s_=(n)=>n===1?'':'s';
  const day=(t)=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  const devLine=(ds)=>ds.length?`${ds.filter(isOn).length} of ${ds.length} device${s_(ds.length)} synced`:'No devices';
  const tone=(ds)=>!ds.length?'':ds.every(isOn)?'ok':ds.some(isOn)?'warn':'bad';
  const syncTxt=(d)=>isOn(d)?'Synced '+P.fmtDate(d.lastSync,true):d.lastSync?'Last synced '+P.fmtDate(d.lastSync,true):'Never synced';
  // status pill: red = trial ended, suspended or every device offline; amber = free trial or some devices offline;
  // grey = nothing set up yet; green = licensed and every device synced
  const pill=(o,os,ds)=>{ const st=orgState(o);
    if(st==='suspended') return '<span class="badge bad">Suspended</span>';
    if(st==='expired') return `<span class="badge bad" title="Trial ended ${esc(P.fmtDate(o.trial_ends_at,true))}">Trial expired</span>`;
    if(st==='trial') return `<span class="badge warn" title="Ends ${esc(P.fmtDate(o.trial_ends_at,true))}">Free trial</span>`;
    if(!os.length) return '<span class="badge">No locations yet</span>';
    if(!ds.length) return '<span class="badge">No devices yet</span>';
    const off=ds.filter(d=>!isOn(d)).length;
    if(off) return `<span class="badge ${off===ds.length?'bad':'warn'}">${off} offline</span>`;
    return '<span class="badge ok">All good</span>'; };
  const licText=(o)=>{ const st=orgState(o);
    if(st==='suspended') return 'Licence suspended';
    if(st==='expired') return 'Expired';
    if(st==='trial') return 'Trial ends '+day(o.trial_ends_at);
    return 'Licensed'; };   // Label licenses the business (not each device)
  const openBtn=(o,os,cls)=>os.length===1?`<button class="btn sm ${cls}" data-open="${esc(os[0].id)}">Open business</button>`:os.length?`<button class="btn sm ${cls}" data-openbiz="${esc(o.id)}">Open business</button>`:`<button class="btn sm ${cls}" data-openorg="${esc(o.id)}">Open business</button>`;
  const card=(o)=>{ const os=sitesOf(o), ds=devsAt(os.map(x=>x.id)), single=os.length===1;
    const q=(o.name+' '+os.map(x=>x.name+' '+(x.address||'')+' '+(x.region||'')).join(' ')).toLowerCase();
    const sub=!os.length?'No locations yet':single?[os[0].name!==o.name&&esc(os[0].name),devLine(ds)].filter(Boolean).join(' · '):`${os.length} locations · ${ds.length?ds.length+' device'+s_(ds.length):'no devices yet'}`;
    return `<article class="card ov-biz" data-q="${esc(q)}"><div class="ov-bh"><div style="flex:1;min-width:0"><h3>${esc(o.name)}</h3><div class="muted small">${sub}</div></div>${pill(o,os,ds)}</div>
      ${single?'':os.map(x=>{ const d=devsAt([x.id]); return `<button type="button" class="ov-loc" data-open="${esc(x.id)}" title="Open on this location"><span class="ov-dot ${tone(d)}"></span><span style="flex:1;min-width:0">${esc(x.name)}</span><span class="muted small">${devLine(d)}</span><span class="ov-chev" aria-hidden="true">›</span></button>`; }).join('')}
      <div class="ov-bf"><span class="muted small">${licText(o)}</span><span class="ov-acts">${trialOk?`<button class="btn sm" data-trial="${esc(o.id)}" title="Extend, end or clear this business's free trial">Trial…</button>`:''}${openBtn(o,os,'primary')}</span></div></article>`; };
  const empty=`<div class="card" style="grid-column:1/-1"><div class="empty" style="padding:28px 12px"><h3 style="font-size:17px;color:var(--ink)">No businesses yet</h3><p class="hint" style="max-width:460px;margin:8px auto 16px">Add a customer business and invite its owner. They can then add their kitchens, menu and staff, or you can set it up for them.</p><div class="btns" style="justify-content:center"><button class="btn primary" data-addb>${ic('plus',16)}Add business</button><a class="btn" href="${LIC_URL}" target="_blank" rel="noopener">Open licence portal ↗</a><button class="btn" data-refresh>${ic('refresh',16)}Refresh</button></div></div></div>`;
  const stat=(key,label,v,t)=>`<button type="button" class="card ov-stat ${t||''}" data-stat="${key}" title="Show the list"><div class="tiny">${label}</div><div class="ov-v">${v}</div></button>`;
  el.innerHTML=`<div class="ovp"><div class="ph keep ov-head"><p class="muted">Every business on Proview Label with its locations. Open one to see it as its team does.</p><div class="btns"><button class="btn" data-refresh title="Refresh">${ic('refresh',16)}Refresh</button><a class="btn" href="${LIC_URL}" target="_blank" rel="noopener">Licences ↗</a><button class="btn primary" data-addb>${ic('plus',16)}Add business</button></div></div>
  <div class="ov-stats">${stat('biz','Businesses',orgs.length)}${stat('loc','Locations',allSites.length)}${stat('dev','Devices',devs.length)}${stat('on','Online',online.length,online.length?'ok':'')}${stat('off','Offline',offline.length,offline.length?'warn':'')}${stat('att','Licences need attention',needs.length,needs.length?'bad':'')}</div>
  ${orgs.length>3?`<div class="ov-tools"><input type="search" id="asq" class="ov-search" placeholder="Search businesses or locations" aria-label="Search businesses or locations" value="${esc(asq)}"></div>`:''}
  <div class="ov-grid">${orgs.length?orgs.map(card).join(''):empty}<p class="muted" id="asnone" style="grid-column:1/-1;display:none">No businesses or locations match “<span></span>”.</p></div></div>`;
  const filt=()=>{ const q=asq.trim().toLowerCase(); let n=0; el.querySelectorAll('[data-q]').forEach(t=>{ const on=!q||t.dataset.q.includes(q); t.style.display=on?'':'none'; if(on) n++; });
    const no=el.querySelector('#asnone'); if(no){ no.style.display=q&&!n?'':'none'; no.querySelector('span').textContent=asq.trim(); } };
  const qi=el.querySelector('#asq'); if(qi){ qi.oninput=()=>{ asq=qi.value; filt(); }; filt(); }
  // each summary box opens the list behind its number
  const li=(attr,t,title,sub,right)=>`<button type="button" class="ov-li" ${attr}><span class="ov-dot ${t}"></span><span style="flex:1;min-width:0"><b>${esc(title)}</b><span class="tiny" style="display:block">${sub}</span></span>${right||''}<span class="ov-chev" aria-hidden="true">›</span></button>`;
  const bizLi=(o)=>{ const os=sitesOf(o), ds=devsAt(os.map(x=>x.id)); return li(`data-mo="${esc(o.id)}"`,tone(ds),o.name,`${os.length} location${s_(os.length)} · ${devLine(ds)}`,pill(o,os,ds)); };
  const locLi=(r)=>{ const ds=devsAt([r.s.id]); return li(`data-ms="${esc(r.s.id)}"`,tone(ds),r.s.name,esc(r.o.name),`<span class="muted small">${devLine(ds)}</span>`); };
  const devLi=(d)=>{ const r=allSites.find(x=>x.s.id===d.siteId); return li(`data-ms="${esc(d.siteId)}"`,isOn(d)?'ok':'bad',d.name||'Handheld',[esc(r.o.name),r.s.name!==r.o.name&&esc(r.s.name),syncTxt(d),d.version&&'v'+esc(d.version)].filter(Boolean).join(' · '),`<span class="muted small">${isOn(d)?'Online':'Offline'}</span>`); };
  const devSort=(a,b)=>String(b.lastSync||'').localeCompare(String(a.lastSync||''));
  const lists={ biz:['Businesses',()=>orgs.map(bizLi),'No businesses yet.'], loc:['Locations',()=>allSites.map(locLi),'No locations yet.'],
    dev:['Devices',()=>devs.slice().sort(devSort).map(devLi),'No handhelds paired yet.'],
    on:['Online now',()=>online.slice().sort(devSort).map(devLi),'No handhelds have synced in the last 6 hours.'],
    off:['Offline',()=>offline.slice().sort(devSort).map(devLi),'Every handheld synced in the last 6 hours.'],
    att:['Licences needing attention',()=>needs.map(bizLi),'Every business is licensed.'] };
  el.querySelectorAll('[data-stat]').forEach(b=>b.onclick=()=>{ const [title,items,none]=lists[b.dataset.stat]; const it=items();
    const m=modal(title,it.length?`<div class="ov-list">${it.join('')}</div>`:`<p class="hint">${none}</p>`,`<button class="btn ghost" data-x>Close</button>`);
    m.querySelectorAll('[data-ms]').forEach(x=>x.onclick=()=>{ closeModal(); setSite(x.dataset.ms); location.hash='overview'; });
    m.querySelectorAll('[data-mo]').forEach(x=>x.onclick=()=>{ closeModal(); setSite('org:'+x.dataset.mo); location.hash=P.live('sites').some(z=>z.orgId===x.dataset.mo)?'overview':'devices'; }); });
  el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ setSite(b.dataset.open); location.hash='overview'; });
  el.querySelectorAll('[data-openorg]').forEach(b=>b.onclick=()=>{ setSite('org:'+b.dataset.openorg); location.hash='devices'; });
  el.querySelectorAll('[data-openbiz]').forEach(b=>b.onclick=(e)=>{ e.preventDefault(); setSite('org:'+b.dataset.openbiz); location.hash='overview'; });
  el.querySelectorAll('[data-addb]').forEach(b=>b.onclick=()=>addBusiness(()=>render()));
  el.querySelectorAll('[data-trial]').forEach(b=>b.onclick=()=>trialForm(b.dataset.trial));
  el.querySelectorAll('[data-refresh]').forEach(b=>b.onclick=async()=>{ if(!CLOUD){ render(); return toast('Up to date'); }
    b.disabled=true; try{ if(!(await checkAccess())) return; applyScope(); await Cloud.sync(P,{full:true}); S=P.get(); render(); toast('Up to date'); }catch(e){ b.disabled=false; toast(Cloud.friendly(e)); } });
};

// Master: extend, end now or clear (= licensed, no longer a trial) a business's free trial
function trialForm(orgId){ const o=(S.orgs||[]).find(x=>x.id===orgId); if(!o) return;
  const ymd=(d)=>{ const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
  const base=Math.max(Date.now(),o.trial_ends_at?new Date(o.trial_ends_at).getTime():0);
  const m=modal('Trial · '+o.name,`<p style="margin-top:0">Status: ${stateTag(o)}${o.trial_ends_at?` <span class="hint">ends ${esc(P.fmtDate(o.trial_ends_at,true))}</span>`:' <span class="hint">not a trial (licensed)</span>'}</p>
    <div class="fld"><label>Trial ends on</label><input class="inp" type="date" id="te" value="${ymd(base+3*day)}"></div>
    <div class="btns" style="margin-bottom:6px"><button class="btn ghost sm" data-add="3">+3 days</button><button class="btn ghost sm" data-add="7">+7 days</button><button class="btn ghost sm" data-add="30">+30 days</button></div>
    <p class="hint">The trial ends at the end of that day. After it ends the business is read-only and its people see “Trial ended” with the licence portal and Proview contact details. Clear the trial once they have a licence.</p>`,
    `<button class="btn ghost" data-x>Cancel</button>${o.trial_ends_at?'<button class="btn ghost" id="tclr">Clear trial (licensed)</button>':''}<button class="btn" id="tsv">Save end date</button>`);
  m.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ m.querySelector('#te').value=ymd(base+(+b.dataset.add)*day); });
  const save=async(ends)=>{ try{ if(CLOUD){ await Cloud.setTrial(orgId,ends); await refreshWho(); } else { o.trial_ends_at=ends; o.trial_expired=!!ends&&new Date(ends)<new Date(); P.save(); }
      closeModal(); toast(ends?'Trial now ends '+P.fmtDate(ends,true):'Trial cleared: '+o.name+' is licensed'); render(); }catch(e){ toast(Cloud.friendly?Cloud.friendly(e):e.message); } };
  m.querySelector('#tsv').onclick=()=>{ const v=m.querySelector('#te').value; if(!v) return toast('Pick a date'); const d=new Date(v+'T23:59:59'); if(isNaN(d)) return toast('Pick a date'); save(d.toISOString()); };
  const c=m.querySelector('#tclr'); if(c) c.onclick=()=>save(null);
}
// Master: create a customer business (and optionally invite its owner). Used by All sites and Sites & devices.
function addBusiness(after){ const m=modal('Add business',`<div class="fld"><label>Business name</label><input class="inp" id="bn" placeholder="e.g. Pepe's Piri Piri"></div><div class="g2"><div class="fld"><label>Owner's name</label><input class="inp" id="on"></div><div class="fld"><label>Owner's email</label><input class="inp" id="oe" type="email" placeholder="They sign in with this"></div></div><p class="hint">The owner signs in with “Sign in with Proview account” or “Create a login” using that email. They can then add their locations, staff and menu.</p>`,`<button class="btn ghost" data-x>Cancel</button><button class="btn" id="sv">Add business</button>`);
    m.querySelector('#sv').onclick=async()=>{ const n=m.querySelector('#bn').value.trim(), oe=m.querySelector('#oe').value.trim().toLowerCase(), on=m.querySelector('#on').value.trim(); if(!n) return toast('Enter the business name'); if(oe&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(oe)) return toast('Check the owner’s email');
      try{ let id; if(CLOUD){ id=await Cloud.createOrg(n,oe,on); await refreshWho(); } else { id='org_'+P.uid(''); S.orgs.push({id,name:n,settings:{}}); if(oe) P.upsert('users',{id:P.uid('u_'),orgId:id,name:on||oe,email:oe,password:'demo',role:'admin',pin:'0000',siteIds:[]}); P.save(); }
        P.ensureRules(id); closeModal(); toast(n+' added'); if(after) after(id); else setSite('org:'+id); }catch(e){ toast(Cloud.friendly?Cloud.friendly(e):e.message); } }; }
VIEWS.devices=(el)=>{
  const ss=P.live('sites').filter(x=>allowedSiteIds().includes(x.id)&&(siteFilter==='all'||x.id===siteFilter||siteFilter==='org:'+x.orgId)), ds=bySite(P.live('devices'));

  <div class="card"><h3>Handhelds</h3><div class="sub">To add one, open Proview Label on the handheld: it shows a pairing code. Tap <b>+ Pair handheld</b> and enter it, or scan the QR code on the handheld with your phone. <b>Mode</b> sets what staff see: Easy (big product buttons, print only) or Detailed (logs, bulk print, wastage, label orders).</div><div id="devs"><div class="hint">Loading…</div></div></div>`;

    box.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>devForm(rows.find(x=>x.id===b.dataset.ed)));

    m.querySelector('#dsv').onclick=async()=>{ const nm=m.querySelector('#dn').value.trim(), site=m.querySelector('#ds').value, md=m.querySelector('#dm').value; if(!nm) return toast('Enter a name');

        audit('updated','Handheld',nm+' ('+(md==='detailed'?'Detailed':'Easy')+')',d.orgId); closeModal(); toast('Saved'); render(); }catch(e){ toast(Cloud.friendly?Cloud.friendly(e):e.message); } }; };
  el.querySelector('#pairB').onclick=()=>withOrg(o=>pairForm(o));
  if(PENDING_PAIR){ const c=PENDING_PAIR; PENDING_PAIR=null; withOrg(o=>pairForm(o,c)); }
  const siteForm=(s,orgId)=>{ const isNew=!s; s=s||{id:'site_'+P.uid(''),orgId,name:'',address:'',region:''}; const m=modal((isNew?'Add location':'Edit location')+' · '+orgName(s.orgId),`<div class="fld"><label>Name</label><input class="inp" id="n" value="${esc(s.name)}"></div><div class="fld"><label>Address</label><input class="inp" id="a" value="${esc(s.address||'')}"></div><div class="fld"><label>Area</label><input class="inp" id="g" value="${esc(s.region||'')}" placeholder="e.g. North London"></div>`,`<button class="btn ghost" data-x>Cancel</button><button class="btn" id="sv">Save</button>`);
    m.querySelector('#sv').onclick=()=>{ s.name=m.querySelector('#n').value.trim(); s.address=m.querySelector('#a').value.trim(); s.region=m.querySelector('#g').value.trim(); if(!s.name) return toast('Enter a name'); P.upsert('sites',s); audit(isNew?'created':'updated','Site',s.name,s.orgId); closeModal(); render(); }; };
  if(canAddSite&&el.querySelector('#addS')) el.querySelector('#addS').onclick=()=>withOrg(o=>{ if(!['master','owner','admin'].includes(orgRole(o))) return toast('Only an owner or admin can add locations.'); siteForm(null,o); });
  el.querySelectorAll('[data-es]').forEach(b=>b.onclick=()=>siteForm({...P.byId('sites',b.dataset.es)}));
  el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ setSite(b.dataset.open); location.hash='overview'; });
  el.querySelectorAll('[data-openorg]').forEach(b=>b.onclick=()=>{ setSite('org:'+b.dataset.openorg); location.hash='overview'; });
  el.querySelectorAll('[data-eo]').forEach(b=>b.onclick=()=>{ const o=S.orgs.find(x=>x.id===b.dataset.eo); const m=modal('Rename business',`<div class="fld"><label>Name</label><input class="inp" id="n" value="${esc(o.name)}"></div>`,`<button class="btn ghost" data-x>Cancel</button><button class="btn" id="sv">Save</button>`);
    m.querySelector('#sv').onclick=async()=>{ const n=m.querySelector('#n').value.trim(); if(!n) return; try{ if(CLOUD) await Cloud.renameOrg(o.id,n); o.name=n; P.save(); closeModal(); render(); }catch(e){ toast(Cloud.friendly(e)); } }; });
  const cfg=el.querySelector('#cfg'); if(cfg) cfg.onclick=()=>{ const all=JSON.parse(P.exportJSON()), o=curOrg(); COLL_KEYS.forEach(k=>{ if(Array.isArray(all[k])) all[k]=all[k].filter(r=>r.orgId===o); }); if(all.orgs) all.orgs=all.orgs.filter(x=>x.id===o); const data=JSON.stringify(all); const m=modal('Device config file',`<p class="hint">Copy this to the device, or save it as a .json file and use Settings → Import data in the app.</p><textarea class="inp" style="min-height:200px;font-family:monospace;font-size:11px" readonly>${esc(data)}</textarea>`,`<button class="btn ghost" id="dl">Download .json</button><button class="btn" id="cp">Copy</button>`);
    m.querySelector('#cp').onclick=()=>{ m.querySelector('textarea').select(); (navigator.clipboard?navigator.clipboard.writeText(data):Promise.reject()).then(()=>toast('Copied')).catch(()=>{try{document.execCommand('copy');toast('Copied');}catch(e){}}); };
    m.querySelector('#dl').onclick=()=>{ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download='proview-label-config.json'; document.body.appendChild(a); a.click(); a.remove(); }catch(e){} toast('If nothing downloaded, use Copy'); }; };
  const imp=el.querySelector('#imp'); if(imp) imp.onclick=()=>{ const m=modal('Import from device',`<p class="hint">Paste the text from the device's Export data, or choose the exported file. Newer records win; nothing is deleted.</p><textarea class="inp" id="t" style="min-height:180px;font-family:monospace;font-size:11px"></textarea><input type="file" id="f" accept=".json" style="margin-top:8px">`,`<button class="btn ghost" data-x>Cancel</button><button class="btn" id="go">Import</button>`);
    m.querySelector('#f').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>m.querySelector('#t').value=rd.result; rd.readAsText(f); };
    m.querySelector('#go').onclick=()=>{ try{ P.importJSON(m.querySelector('#t').value); audit('imported','Device data','Merged device export'); closeModal(); toast('Device data merged'); render(); }catch(e){ toast('That is not a valid Proview Label export'); } }; };
};

// ----- back-office logins: pl_members in the cloud, demo users with an email in the demo -----
const Logins={
  async list(orgIds){ if(CLOUD) return (await Cloud.members(orgIds)).map(m=>({...m,active:!!m.user_id}));
    return P.live('users').filter(u=>u.email&&u.role!=='master'&&orgIds.includes(u.orgId)).map(u=>({id:u.id,org_id:u.orgId,email:u.email,name:u.name,role:u.role==='admin'?'admin':u.role,site_ids:u.siteIds||[],features:u.features||{},active:true,_demo:true})); },
  async save(m){ if(CLOUD) return Cloud.saveMember(m);
    const u=m.id?P.byId('users',m.id):{id:P.uid('u_'),pin:String(1000+Math.floor(Math.random()*9000)),password:'demo'};
    P.upsert('users',{...u,orgId:m.org_id,name:m.name,email:m.email,features:m.features||{},role:m.role==='owner'?'admin':m.role,siteIds:m.role==='manager'?m.site_ids:P.live('sites').filter(x=>x.orgId===m.org_id).map(x=>x.id)}); return u.id; },
  async remove(m){ if(CLOUD) return Cloud.removeMember(m.id); P.remove('users',m.id); }
};
VIEWS.users=(el)=>{
  const orgIds=scopeOrgIds(); const canLogins=orgIds.some(o=>['master','owner','admin'].includes(orgRole(o)));
  const staff=P.live('users').filter(u=>!u.email&&u.role!=='master'&&orgIds.includes(u.orgId)&&(u.siteIds||[]).some(id=>allowedSiteIds().includes(id)));
  const org=curOrg(); const st=org?orgSettings(org):{};
  const roleTag=(r)=>`<span class="tag ${r==='owner'?'pur':r==='admin'?'blue':'mute'}">${r==='owner'?'Owner':P.ROLES[r]||r}</span>`;
  el.innerHTML=`<div class="ph"><div><h1>Users & permissions</h1><p>Back-office logins use email (or “Sign in with Proview account”). Kitchen staff use a 4-digit PIN on the device.</p></div><div class="btns">${canLogins?'<button class="btn ghost" id="addL">+ Back-office login</button>':''}<button class="btn" id="addU">+ Device staff</button></div></div>
  <div class="cols"><div>
    <div class="card"><h3>Back-office logins</h3><div class="sub">People who can sign in here. Managers only see their own locations.</div><div id="logins"><div class="hint">Loading…</div></div></div>
    <div class="card"><h3>Device staff</h3><div class="sub">Sign in on the handheld with a PIN. They print and log wastage; device managers can also edit products.</div>
      <table><thead><tr><th>Name</th><th>On device</th>${multiOrg()?'<th>Business</th>':''}<th>Locations</th><th>Labels printed</th><th></th></tr></thead><tbody>${staff.map(u=>`<tr><td><div class="row"><div class="av">${esc(P.initials(u.name))}</div><b>${esc(u.name)}</b></div></td><td>${roleTag(u.role)}</td>${multiOrg()?`<td class="hint">${esc(orgName(u.orgId))}</td>`:''}<td>${(u.siteIds||[]).map(siteName).map(esc).join(', ')}</td><td>${P.live('labels').filter(l=>l.userId===u.id).reduce((a,l)=>a+(+l.qty||1),0)}</td><td style="text-align:right"><button class="icbtn" data-ed="${u.id}">✎</button><button class="icbtn" data-del="${u.id}">🗑</button></td></tr>`).join('')||`<tr><td colspan="6" class="empty">No device staff yet.</td></tr>`}</tbody></table></div>
  </div>
  <div class="card" style="align-self:start"><h3>Permissions</h3><div class="sub">${org?'Apply to every device at '+esc(orgName(org)):'Pick one business in the picker to change its permissions.'}</div>
    ${[['requirePhoto','Require a photo for wastage','Staff must attach a photo before logging wastage'],['requireApproval','Approve new products','Products added from the menu analyser or devices wait for a manager'],['staffCanEdit','Staff can edit products','Off: only managers can add or change products on devices']].map(([k,t,d])=>`<div class="setrow"><div><b>${t}</b><span class="hint">${d}</span></div><button class="tgl ${st[k]?'on':''}" data-set="${k}" ${org&&['master','owner','admin'].includes(orgRole(org))?'':'disabled style="opacity:.4"'} aria-label="${t}"></button></div>`).join('')}
    <div class="sub" style="margin-top:12px"><b>Owner/Admin</b> everything in their business · <b>Manager</b> their own locations and the features you switch on, no settings · <b>Master</b> (Proview) every business</div></div></div>`;
  // logins table (async in cloud mode)
  (async()=>{ const box=el.querySelector('#logins'); let rows=[];
    try{ rows=await Logins.list(orgIds); }catch(e){ box.innerHTML=`<div class="lg-err">${esc(Cloud.friendly(e))}</div>`; return; }
    rows=rows.filter(m=>['master','owner','admin'].includes(orgRole(m.org_id))||m.site_ids.some(id=>allowedSiteIds().includes(id))||m.email===(me().email||''));
    box.innerHTML=`<table><thead><tr><th>Name</th><th>Role</th>${multiOrg()?'<th>Business</th>':''}<th>Locations</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(m=>`<tr><td><b>${esc(m.name||m.email)}</b><div class="hint">${esc(m.email)}</div></td><td>${roleTag(m.role)}</td>${multiOrg()?`<td class="hint">${esc(orgName(m.org_id))}</td>`:''}<td>${m.role==='manager'?(m.site_ids||[]).map(siteName).map(esc).join(', ')||'<span class="hint">None yet</span>':'<span class="hint">All locations</span>'}${m.role==='manager'?(()=>{ const off=FEATURES.filter(([k])=>((m.features||{})[k])===false); return `<div class="hint">${off.length?'No access to: '+off.map(([,l])=>esc(l.split(',')[0])).join(', '):'All features'}</div>`; })():''}</td><td>${m.active?'<span class="tag ok">Active</span>':'<span class="tag warn">Invited</span>'}</td><td style="text-align:right">${['master','owner','admin'].includes(orgRole(m.org_id))?`<button class="icbtn" data-em="${m.id}">✎</button><button class="icbtn" data-dm="${m.id}">🗑</button>`:''}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">No logins yet.</td></tr>`}</tbody></table>`;
    box.querySelectorAll('[data-em]').forEach(b=>b.onclick=()=>loginForm(rows.find(x=>x.id===b.dataset.em)));
    box.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{ const m=rows.find(x=>x.id===b.dataset.dm); confirmM('Remove '+(m.name||m.email)+'?','They will no longer be able to sign in to Proview Label for '+orgName(m.org_id)+'.','Remove',async()=>{ try{ await Logins.remove(m); audit('deleted','Login',m.email,m.org_id); render(); }catch(e){ toast(Cloud.friendly(e)); } }); });
  })();
  const loginForm=(m,orgId)=>{ const isNew=!m; m=m||{org_id:orgId,email:'',name:'',role:'manager',site_ids:[]}; const sites=P.live('sites').filter(x=>x.orgId===m.org_id);
    const roles=[['owner','Owner'],['admin','Admin'],['manager','Manager']].filter(([k])=>k!=='owner'||['master','owner'].includes(orgRole(m.org_id)));
    const md=modal((isNew?'Add back-office login':'Edit login')+' · '+orgName(m.org_id),`<div class="g2"><div class="fld"><label>Name</label><input class="inp" id="n" value="${esc(m.name)}"></div><div class="fld"><label>Email</label><input class="inp" id="e" type="email" value="${esc(m.email)}" ${isNew?'':'disabled'}></div></div>
      <div class="fld"><label>Role</label><select class="inp" id="r">${roles.map(([k,v])=>`<option value="${k}" ${m.role===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div id="sb"><div class="lb">Locations they can use</div><div class="algrid" id="sitesG">${sites.map(x=>`<label class="${(m.site_ids||[]).includes(x.id)?'on':''}"><input type="checkbox" value="${x.id}" ${(m.site_ids||[]).includes(x.id)?'checked':''}>${esc(x.name)}</label>`).join('')||'<span class="hint">Add a location first.</span>'}</div>
        <div class="lb" style="margin-top:14px">What this manager can use</div><div class="algrid" id="featG">${FEATURES.map(([k,l])=>{ const on=((m.features||{})[k])!==false; return `<label class="${on?'on':''}"><input type="checkbox" data-f="${k}" ${on?'checked':''}>${esc(l)}</label>`; }).join('')}</div>
        <p class="hint">Owners and admins always have every feature. Settings is owner/admin only.</p></div>
      <div class="fld" style="margin-top:14px"><label>${isNew?'Password':'New password'} <span class="hint">${isNew?'optional · set one and they can sign in straight away, no email needed':'optional · leave empty to keep their current password'}</span></label>
        <div style="display:flex;gap:8px"><input class="inp" id="pw" type="text" autocomplete="new-password" placeholder="At least 8 characters" style="flex:1;font-family:ui-monospace,Menlo,monospace"><button class="btn ghost" id="pwg" type="button">Generate</button></div>
        <div class="hint" style="margin-top:6px">Give it to them in person or by phone. They can change it any time with “Forgot password?”.</div></div>
      ${isNew?'<p class="hint" style="margin-top:12px">Without a password they sign in at label.proviewcrm.co.uk with “Sign in with Proview account” (same login as your other Proview apps), or “Create a login” with this email.</p>':''}`,`<button class="btn ghost" data-x>Cancel</button><button class="btn" id="sv">${isNew?'Add login':'Save'}</button>`);
    const sync=()=>md.querySelector('#sb').style.display=md.querySelector('#r').value==='manager'?'':'none'; sync(); md.querySelector('#r').onchange=sync;
    md.querySelector('#pwg').onclick=()=>{ const A='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', r=new Uint32Array(12); crypto.getRandomValues(r); md.querySelector('#pw').value=[...r].map(x=>A[x%A.length]).join(''); };
    md.querySelectorAll('.algrid input').forEach(cb=>cb.onchange=()=>cb.parentElement.classList.toggle('on',cb.checked));
    md.querySelector('#sv').onclick=async()=>{ const e=md.querySelector('#e').value.trim().toLowerCase(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return toast('Enter a valid email');
      const rec={...m,email:e,name:md.querySelector('#n').value.trim(),role:md.querySelector('#r').value,site_ids:[...md.querySelectorAll('#sitesG input:checked')].map(x=>x.value),features:Object.fromEntries([...md.querySelectorAll('#featG input')].map(x=>[x.dataset.f,x.checked]))};
      if(rec.role==='manager'&&!rec.site_ids.length) return toast('Pick at least one location for a manager');
      const pw=md.querySelector('#pw').value; if(pw&&pw.length<8) return toast('Use at least 8 characters for the password');
      const btn=md.querySelector('#sv'); btn.disabled=true;
      try{ const id=await Logins.save(rec); audit(isNew?'created':'updated','Login',e+' ('+rec.role+')',rec.org_id);
        if(pw){ try{ if(CLOUD) await Cloud.setMemberPassword(id||rec.id,pw); audit('updated','Login password',e,rec.org_id); }
          catch(px){ btn.disabled=false; closeModal(); render(); return toast((isNew?'Login added, but the password wasn’t set: ':'Password not changed: ')+px.message,true); } }
        closeModal(); toast(pw?(isNew?'Login added · they can sign in now with that password':'Password changed'):(isNew?'Login added':'Saved')); render(); }
      catch(ex){ btn.disabled=false; toast(Cloud.friendly?Cloud.friendly(ex):ex.message); } }; };
  const staffForm=(u,orgId)=>{ const isNew=!u; u=u||{id:P.uid('u_'),orgId,name:'',role:'staff',pin:'',siteIds:allowedSiteIds().filter(id=>(P.byId('sites',id)||{}).orgId===orgId&&(siteFilter===id||!P.byId('sites',siteFilter))).slice(0,1)};
    const sites=P.live('sites').filter(x=>x.orgId===u.orgId&&allowedSiteIds().includes(x.id));
    const md=modal((isNew?'Add device staff':'Edit device staff')+(multiOrg()||isMaster()?' · '+orgName(u.orgId):''),`<div class="g2"><div class="fld"><label>Name</label><input class="inp" id="n" value="${esc(u.name)}"></div><div class="fld"><label>4-digit PIN</label><input class="inp" id="p" value="${esc(u.pin)}" maxlength="4" inputmode="numeric"></div></div><div class="fld"><label>On the device</label><select class="inp" id="r"><option value="staff">Staff</option><option value="manager" ${u.role==='manager'?'selected':''}>Manager (can edit products)</option></select></div><div class="lb">Locations they can use</div><div class="algrid">${sites.map(x=>`<label class="${(u.siteIds||[]).includes(x.id)?'on':''}"><input type="checkbox" value="${x.id}" ${(u.siteIds||[]).includes(x.id)?'checked':''}>${esc(x.name)}</label>`).join('')}</div>`,`<button class="btn ghost" data-x>Cancel</button><button class="btn" id="sv">Save</button>`);
    md.querySelectorAll('.algrid input').forEach(cb=>cb.onchange=()=>cb.parentElement.classList.toggle('on',cb.checked));
    md.querySelector('#sv').onclick=()=>{ u.name=md.querySelector('#n').value.trim(); u.pin=md.querySelector('#p').value.trim(); u.role=md.querySelector('#r').value; u.siteIds=[...md.querySelectorAll('.algrid input:checked')].map(x=>x.value);
      if(!u.name) return toast('Enter a name'); if(!/^\d{4}$/.test(u.pin)) return toast('PIN must be 4 digits'); if(!u.siteIds.length) return toast('Pick at least one location');
      if(P.live('users').some(x=>x.id!==u.id&&x.pin===u.pin&&x.orgId===u.orgId&&(x.siteIds||[]).some(id=>u.siteIds.includes(id)))) return toast('Someone at that location already uses this PIN');
      P.upsert('users',u); audit(isNew?'created':'updated','Device staff',u.name,u.orgId); closeModal(); render(); }; };
  const al=el.querySelector('#addL'); if(al) al.onclick=()=>withOrg(o=>{ if(!['master','owner','admin'].includes(orgRole(o))) return toast('Only an owner or admin can add logins.'); loginForm(null,o); });
  el.querySelector('#addU').onclick=()=>withOrg(o=>staffForm(null,o));
  el.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>staffForm({...P.byId('users',b.dataset.ed)}));
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const u=P.byId('users',b.dataset.del); confirmM('Remove '+u.name+'?','They will no longer be able to sign in on the devices.','Remove',()=>{P.remove('users',u.id);audit('deleted','Device staff',u.name,u.orgId);render();}); });
  el.querySelectorAll('[data-set]').forEach(b=>b.onclick=async()=>{ if(!org||b.disabled) return; await setOrgSetting(org,b.dataset.set,!st[b.dataset.set]); audit('updated','Permission',b.dataset.set+': '+(!st[b.dataset.set]?'on':'off'),org); render(); });
};

    m.querySelector('#sv').onclick=async()=>{ const a=m.querySelector('#a').value; if(a.length<8) return toast('Use at least 8 characters'); if(a!==m.querySelector('#b').value) return toast('The passwords don’t match'); try{ await Cloud.setPassword(a); closeModal(); toast('Password changed'); }catch(e){ toast(Cloud.friendly(e)); } }; };
  const sn=el.querySelector('#sn'); if(sn) sn.onclick=()=>doSync(false);
  const rst=el.querySelector('#rst'); if(rst) rst.onclick=()=>confirmM('Reset demo data?','All changes in this browser are replaced with the sample data.','Reset',()=>{P.reset();toast('Demo data restored');render();});
};

if(CLOUD){
  Cloud.onRecovery(()=>{ LOGIN={msg:'',kind:'bad',mode:'newpw'}; WHO=null; renderLogin(); });
  splash();
  (async()=>{
    try{ await Cloud.consumeSsoHash(); }catch(e){ LOGIN={msg:e.message,kind:'bad',mode:'signin'}; }
    const hp=new URLSearchParams(location.hash.slice(1));
    if(hp.get('type')==='recovery'){ LOGIN={msg:'',kind:'bad',mode:'newpw'}; return renderLogin(); }
    if(hp.get('error_description')) LOGIN={msg:'That link didn’t work: '+hp.get('error_description'),kind:'bad',mode:'signin'};
    if(await Cloud.user()) boot(); else render();
  })();
} else render();
window.__pvd={render,get WHO(){return WHO;}};
